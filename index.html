}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ===== GLOBALS =====
let scene,camera,renderer,controls,clock;
let avatar,faceGroup,eyeL,eyeR,pupilL,pupilR,mouthObj,cherryObj;
let voiceOn=true,rate=0.9,isTalking=false,isWalking=false;
const S=window.speechSynthesis;
const EL_KEY='sk_112617f23620344b47cad6da36eaab66088582e8c18b7016';
const EL_VOICE='s91wgzodwL1wfwitqbIm';
const EL_MODEL='eleven_multilingual_v2';

// ===== INIT THREE.JS =====
function initThree(){
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x080810);
    scene.fog=new THREE.FogExp2(0x080810,0.015);
    
    camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);
    camera.position.set(0,2,8);
    camera.lookAt(0,1,0);
    
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.2;
    document.body.prepend(renderer.domElement);
    
    controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;
    controls.dampingFactor=0.08;
    controls.enablePan=false;
    controls.minDistance=4;
    controls.maxDistance=15;
    controls.maxPolarAngle=Math.PI/1.8;
    controls.target.set(0,1.5,0);
    
    clock=new THREE.Clock();
    
    // Lighting
    const ambLight=new THREE.AmbientLight(0x404060,0.4);
    scene.add(ambLight);
    
    const mainLight=new THREE.DirectionalLight(0xfff0e0,1.8);
    mainLight.position.set(5,8,5);
    mainLight.castShadow=true;
    mainLight.shadow.mapSize.set(2048,2048);
    mainLight.shadow.camera.near=0.5;
    mainLight.shadow.camera.far=30;
    mainLight.shadow.camera.left=-5;
    mainLight.shadow.camera.right=5;
    mainLight.shadow.camera.top=5;
    mainLight.shadow.camera.bottom=-5;
    mainLight.shadow.bias=-0.001;
    scene.add(mainLight);
    
    const rimLight=new THREE.DirectionalLight(0xff6b6b,0.6);
    rimLight.position.set(-3,4,-3);
    scene.add(rimLight);
    
    const fillLight=new THREE.DirectionalLight(0x6b8cff,0.3);
    fillLight.position.set(-4,2,4);
    scene.add(fillLight);
    
    const pointLight=new THREE.PointLight(0xff9966,0.5,10);
    pointLight.position.set(2,3,2);
    scene.add(pointLight);
    
    // Ground
    const groundGeo=new THREE.CircleGeometry(15,64);
    const groundMat=new THREE.MeshStandardMaterial({color:0x0a0a18,roughness:0.9,metalness:0.1});
    const ground=new THREE.Mesh(groundGeo,groundMat);
    ground.rotation.x=-Math.PI/2;
    ground.position.y=-0.5;
    ground.receiveShadow=true;
    scene.add(ground);
    
    // Shadow blob
    const shadowGeo=new THREE.CircleGeometry(1.2,32);
    const shadowMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.25});
    const shadowBlob=new THREE.Mesh(shadowGeo,shadowMat);
    shadowBlob.rotation.x=-Math.PI/2;
    shadowBlob.position.y=-0.49;
    shadowBlob.name='shadowBlob';
    scene.add(shadowBlob);
    
    // Particles
    createParticles();
}

// ===== AVATAR MODEL =====
function createAvatar(){
    avatar=new THREE.Group();
    
    // Materials
    const matBase=new THREE.MeshStandardMaterial({color:0xf5a623,roughness:0.4,metalness:0.05});
    const matMid=new THREE.MeshStandardMaterial({color:0xffe8d0,roughness:0.35,metalness:0.02});
    const matTop=new THREE.MeshStandardMaterial({color:0xff9ab0,roughness:0.3,metalness:0.02});
    const matGlaze=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.1,metalness:0.1,transparent:true,opacity:0.7});
    const matCherry=new THREE.MeshStandardMaterial({color:0xe74c3c,roughness:0.2,metalness:0.15});
    const matStem=new THREE.MeshStandardMaterial({color:0x4a7c23,roughness:0.6});
    const matDrip=new THREE.MeshStandardMaterial({color:0xfff0f0,roughness:0.15,metalness:0.05,transparent:true,opacity:0.85});
    const matEye=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.1,metalness:0.05});
    const matIris=new THREE.MeshStandardMaterial({color:0x4a3a2a,roughness:0.15,metalness:0.1});
    const matPupil=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.05,metalness:0.2});
    const matMouth=new THREE.MeshStandardMaterial({color:0xe74c3c,roughness:0.3,metalness:0.05});
    const matTeeth=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.2});
    const matArm=new THREE.MeshStandardMaterial({color:0xffb0c0,roughness:0.4,metalness:0.02});
    
    // Base layer
    const baseGeo=new THREE.CylinderGeometry(1.1,1.15,0.8,48);
    const base=new THREE.Mesh(baseGeo,matBase);
    base.position.y=0.4;
    base.castShadow=true;
    base.receiveShadow=true;
    avatar.add(base);
    
    // Mid layer
    const midGeo=new THREE.CylinderGeometry(1.0,1.05,0.5,48);
    const mid=new THREE.Mesh(midGeo,matMid);
    mid.position.y=1.05;
    mid.castShadow=true;
    avatar.add(mid);
    
    // Top layer
    const topGeo=new THREE.CylinderGeometry(0.88,0.92,0.45,48);
    const top=new THREE.Mesh(topGeo,matTop);
    top.position.y=1.52;
    top.castShadow=true;
    avatar.add(top);
    
    // Glaze
    const glazeGeo=new THREE.TorusGeometry(0.88,0.06,16,48);
    const glaze=new THREE.Mesh(glazeGeo,matGlaze);
    glaze.position.y=1.75;
    glaze.rotation.x=Math.PI/2;
    avatar.add(glaze);
    
    // Drips
    for(let i=0;i<8;i++){
        const angle=(i/8)*Math.PI*2;
        const h=0.15+Math.random()*0.25;
        const dripGeo=new THREE.CylinderGeometry(0.04,0.06,h,8);
        const drip=new THREE.Mesh(dripGeo,matDrip);
        drip.position.set(Math.cos(angle)*0.88,1.75-h/2,Math.sin(angle)*0.88);
        drip.castShadow=true;
        avatar.add(drip);
    }
    
    // Cherry
    const cherryGroup=new THREE.Group();
    const cherryGeo=new THREE.SphereGeometry(0.15,32,32);
    cherryObj=new THREE.Mesh(cherryGeo,matCherry);
    cherryObj.position.y=0.2;
    cherryObj.castShadow=true;
    cherryGroup.add(cherryObj);
    
    const stemGeo=new THREE.CylinderGeometry(0.015,0.02,0.18,8);
    const stem=new THREE.Mesh(stemGeo,matStem);
    stem.position.y=0.35;
    cherryGroup.add(stem);
    
    // Leaf
    const leafShape=new THREE.Shape();
    leafShape.moveTo(0,0);
    leafShape.quadraticCurveTo(0.06,0.04,0.12,0);
    leafShape.quadraticCurveTo(0.06,-0.02,0,0);
    const leafGeo=new THREE.ShapeGeometry(leafShape);
    const leafMat=new THREE.MeshStandardMaterial({color:0x5a9e2f,roughness:0.5,side:THREE.DoubleSide});
    const leaf=new THREE.Mesh(leafGeo,leafMat);
    leaf.position.set(0.02,0.32,0);
    leaf.rotation.z=-0.3;
    cherryGroup.add(leaf);
    
    cherryGroup.position.y=1.75;
    avatar.add(cherryGroup);
    
    // Face
    faceGroup=new THREE.Group();
    faceGroup.position.set(0,1.15,0.95);
    
    // Eyes
    eyeL=createEye(matEye,matIris,matPupil);
    eyeL.position.set(-0.28,0.12,0);
    faceGroup.add(eyeL);
    
    eyeR=createEye(matEye,matIris,matPupil);
    eyeR.position.set(0.28,0.12,0);
    faceGroup.add(eyeR);
    
    pupilL=eyeL.getObjectByName('pupil');
    pupilR=eyeR.getObjectByName('pupil');
    
    // Eyebrows
    const browGeo=new THREE.BoxGeometry(0.18,0.025,0.03);
    const browMat=new THREE.MeshStandardMaterial({color:0x8b7060,roughness:0.6});
    const browL=new THREE.Mesh(browGeo,browMat);
    browL.position.set(-0.28,0.32,0.02);
    browL.rotation.z=0.1;
    browL.name='browL';
    faceGroup.add(browL);
    
    const browR=new THREE.Mesh(browGeo,browMat);
    browR.position.set(0.28,0.32,0.02);
    browR.rotation.z=-0.1;
    browR.name='browR';
    faceGroup.add(browR);
    
    // Cheeks
    const cheekGeo=new THREE.SphereGeometry(0.08,16,16);
    const cheekMat=new THREE.MeshStandardMaterial({color:0xffaaaa,roughness:0.5,transparent:true,opacity:0.4});
    const cheekL=new THREE.Mesh(cheekGeo,cheekMat);
    cheekL.position.set(-0.38,-0.02,0.02);
    cheekL.scale.set(1,0.6,0.5);
    cheekL.name='cheekL';
    faceGroup.add(cheekL);
    
    const cheekR=new THREE.Mesh(cheekGeo,cheekMat);
    cheekR.position.set(0.38,-0.02,0.02);
    cheekR.scale.set(1,0.6,0.5);
    cheekR.name='cheekR';
    faceGroup.add(cheekR);
    
    // Mouth
    mouthObj=createMouth(matMouth,matTeeth);
    mouthObj.position.set(0,-0.18,0.02);
    faceGroup.add(mouthObj);
    
    avatar.add(faceGroup);
    
    // Arms
    const armGeo=new THREE.CapsuleGeometry(0.06,0.35,8,16);
    
    const armL=new THREE.Mesh(armGeo,matArm);
    armL.position.set(-1.15,1.0,0.3);
    armL.rotation.z=0.4;
    armL.name='armL';
    armL.castShadow=true;
    avatar.add(armL);
    
    const armR=new THREE.Mesh(armGeo,matArm);
    armR.position.set(1.15,1.0,0.3);
    armR.rotation.z=-0.4;
    armR.name='armR';
    armR.castShadow=true;
    avatar.add(armR);
    
    // Hands
    const handGeo=new THREE.SphereGeometry(0.08,16,16);
    const handMat=new THREE.MeshStandardMaterial({color:0xffd0dc,roughness:0.4});
    
    const handL=new THREE.Mesh(handGeo,handMat);
    handL.position.set(-1.35,0.85,0.3);
    handL.name='handL';
    avatar.add(handL);
    
    const handR=new THREE.Mesh(handGeo,handMat);
    handR.position.set(1.35,0.85,0.3);
    handR.name='handR';
    avatar.add(handR);
    
    avatar.position.y=0;
    scene.add(avatar);
}

function createEye(matWhite,matIris,matPupil){
    const group=new THREE.Group();
    
    const whiteGeo=new THREE.SphereGeometry(0.14,32,32);
    const white=new THREE.Mesh(whiteGeo,matWhite);
    white.scale.set(1,1.1,0.7);
    group.add(white);
    
    const irisGeo=new THREE.CircleGeometry(0.07,32);
    const iris=new THREE.Mesh(irisGeo,matIris);
    iris.position.z=0.09;
    group.add(iris);
    
    const pupilGeo=new THREE.CircleGeometry(0.035,32);
    const pupil=new THREE.Mesh(pupilGeo,matPupil);
    pupil.position.z=0.1;
    pupil.name='pupil';
    group.add(pupil);
    
    // Reflections
    const refGeo=new THREE.CircleGeometry(0.015,16);
    const refMat=new THREE.MeshBasicMaterial({color:0xffffff});
    const ref1=new THREE.Mesh(refGeo,refMat);
    ref1.position.set(-0.02,0.02,0.11);
    group.add(ref1);
    
    const ref2=new THREE.Mesh(new THREE.CircleGeometry(0.008,16),refMat);
    ref2.position.set(0.02,-0.02,0.11);
    group.add(ref2);
    
    return group;
}

function createMouth(matMouth,matTeeth){
    const group=new THREE.Group();
    
    const mouthGeo=new THREE.SphereGeometry(0.1,32,16,0,Math.PI*2,0,Math.PI/2);
    const mouth=new THREE.Mesh(mouthGeo,matMouth);
    mouth.rotation.x=Math.PI;
    mouth.name='mouthMain';
    group.add(mouth);
    
    const teethGeo=new THREE.BoxGeometry(0.12,0.02,0.03);
    const teeth=new THREE.Mesh(teethGeo,matTeeth);
    teeth.position.set(0,0,0.02);
    teeth.name='teeth';
    group.add(teeth);
    
    return group;
}

// ===== PARTICLES =====
function createParticles(){
    const count=80;
    const geo=new THREE.BufferGeometry();
    const positions=new Float32Array(count*3);
    for(let i=0;i<count;i++){
        positions[i*3]=(Math.random()-0.5)*20;
        positions[i*3+1]=Math.random()*10;
        positions[i*3+2]=(Math.random()-0.5)*20;
    }
    geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
    const mat=new THREE.PointsMaterial({color:0xffddbb,size:0.03,transparent:true,opacity:0.4});
    const particles=new THREE.Points(geo,mat);
    particles.name='particles';
    scene.add(particles);
}

// ===== ANIMATION =====
let idleTime=0,blinkTimer=0,nextBlink=2+Math.random()*4;
let breathPhase=0,mouthPhase=0;

function animate(){
    requestAnimationFrame(animate);
    const dt=clock.getDelta();
    const t=clock.getElapsedTime();
    
    idleTime+=dt;
    blinkTimer+=dt;
    breathPhase+=dt*1.5;
    
    if(avatar){
        // Idle breathing
        if(!isWalking&&!isTalking){
            avatar.position.y=Math.sin(breathPhase)*0.03;
            avatar.rotation.z=Math.sin(breathPhase*0.7)*0.02;
        }
        
        // Blink
        if(blinkTimer>nextBlink){
            blinkTimer=0;
            nextBlink=2+Math.random()*4;
            blink();
        }
        
        // Mouth animation when talking
        if(isTalking){
            mouthPhase+=dt*12;
            const mouthMain=mouthObj.getObjectByName('mouthMain');
            const teeth=mouthObj.getObjectByName('teeth');
            if(mouthMain){
                const s=0.8+Math.sin(mouthPhase)*0.4;
                mouthMain.scale.set(s,1+Math.sin(mouthPhase*1.3)*0.3,1);
            }
            if(teeth)teeth.visible=Math.sin(mouthPhase*0.8)>0;
        }
        
        // Cherry bob
        if(cherryObj){
            cherryObj.parent.rotation.z=Math.sin(t*2)*0.15;
            cherryObj.parent.position.y=1.75+Math.sin(t*1.5)*0.02;
        }
        
        // Arm wave when idle
        const armL=avatar.getObjectByName('armL');
        const armR=avatar.getObjectByName('armR');
        const handL=avatar.getObjectByName('handL');
        const handR=avatar.getObjectByName('handR');
        
        if(armL&&!isWalking){
            armL.rotation.z=0.4+Math.sin(t*0.8)*0.05;
            if(handL)handL.position.y=0.85+Math.sin(t*0.8)*0.02;
        }
        if(armR&&!isWalking){
            armR.rotation.z=-0.4+Math.sin(t*0.8+1)*0.05;
            if(handR)handR.position.y=0.85+Math.sin(t*0.8+1)*0.02;
        }
        
        // Particles drift
        const particles=scene.getObjectByName('particles');
        if(particles){
            const pos=particles.geometry.attributes.position;
            for(let i=0;i<pos.count;i++){
                pos.array[i*3+1]+=dt*0.1;
                if(pos.array[i*3+1]>10)pos.array[i*3+1]=0;
            }
            pos.needsUpdate=true;
        }
        
        // Shadow blob follows
        const shadow=scene.getObjectByName('shadowBlob');
        if(shadow){
            shadow.position.x=avatar.position.x;
            shadow.position.z=avatar.position.z;
            shadow.scale.setScalar(1+avatar.position.y*0.5);
        }
    }
    
    controls.update();
    renderer.render(scene,camera);
}

function blink(){
    if(!eyeL||!eyeR)return;
    const blinkAnim=()=>{
        let frame=0;
        const anim=()=>{
            frame++;
            const s=frame<=5?1-frame/5:frame<=10?(frame-5)/5:1;
            eyeL.scale.y=Math.max(0.1,s);
            eyeR.scale.y=Math.max(0.1,s);
            if(frame<10)requestAnimationFrame(anim);
        };
        anim();
    };
    blinkAnim();
}

// ===== VOICE =====
async function speakEL(txt){
    document.getElementById('loading').classList.add('on');
    try{
        const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${EL_VOICE}`,{
            method:'POST',
            headers:{'Content-Type':'application/json','xi-api-key':EL_KEY},
            body:JSON.stringify({text:txt,model_id:EL_MODEL,voice_settings:{stability:0.5,similarity_boost:0.75}})
        });
        if(!r.ok)throw new Error(r.status);
        const blob=await r.blob();
        const url=URL.createObjectURL(blob);
        const audio=new Audio(url);
        document.getElementById('loading').classList.remove('on');
        audio.onplay=()=>{isTalking=true;showBubble(txt)};
        audio.onended=()=>{isTalking=false;hideBubble();URL.revokeObjectURL(url)};
        audio.onerror=()=>{document.getElementById('loading').classList.remove('on');speakFB(txt)};
        await audio.play();
    }catch(e){document.getElementById('loading').classList.remove('on');speakFB(txt)}
}

function speakFB(txt){
    if(!S){showBubble(txt);return}
    S.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='es-ES';u.rate=rate;u.pitch=1.05;u.volume=1;
    const vs=S.getVoices();
    const p=['Microsoft Sabina','Microsoft Helena','Google español','Paulina','es-ES'];
    let v=null;for(const n of p){v=vs.find(x=>x.name.includes(n));if(v)break}
    if(!v)v=vs.find(x=>x.lang.startsWith('es'));
    if(v)u.voice=v;
    u.onstart=()=>{isTalking=true;showBubble(txt)};
    u.onend=()=>{isTalking=false;hideBubble()};
    S.speak(u);
}

function speak(txt){if(!voiceOn){showBubble(txt);return}if(EL_KEY&&EL_VOICE){speakEL(txt);return}speakFB(txt)}
