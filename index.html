<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#080810;overflow:hidden;color:#fff}
canvas{display:block;position:fixed;inset:0;z-index:1}

/* UI */
.ui{position:fixed;z-index:100;pointer-events:none}
.ui>*{pointer-events:auto}

.brand{position:fixed;top:14px;right:16px;z-index:100;text-align:right}
.brand h1{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#ff6b6b,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.brand p{font-size:.6rem;color:#444;letter-spacing:4px;text-transform:uppercase;margin-top:3px}

.panel{position:fixed;top:14px;left:14px;z-index:100;display:flex;flex-direction:column;gap:6px}
.btn{padding:9px 16px;border:1px solid rgba(255,255,255,.07);border-radius:10px;font-size:.78rem;cursor:pointer;transition:all .3s;font-weight:600;background:rgba(10,10,25,.88);color:#bbb;backdrop-filter:blur(10px)}
.btn:hover{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.3);color:#fff;transform:translateX(4px)}
.btn.active{background:linear-gradient(135deg,#ff6b6b,#ee5a24);border-color:transparent;color:#fff}

.info-panel{position:fixed;bottom:14px;left:14px;z-index:100;background:rgba(10,10,25,.92);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px 20px;min-width:220px;backdrop-filter:blur(12px);transition:all .4s;opacity:0;transform:translateY(10px)}
.info-panel.show{opacity:1;transform:translateY(0)}
.info-panel h3{font-size:.95rem;color:#ff6b6b;margin-bottom:6px}
.info-panel .price{font-size:1.1rem;color:#00b894;font-weight:700;margin:6px 0}
.info-panel .desc{font-size:.78rem;color:#999;line-height:1.5}

.products{position:fixed;top:50%;right:14px;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:7px}
.card{background:rgba(10,10,25,.9);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px 16px;cursor:pointer;transition:all .35s;display:flex;align-items:center;gap:10px;min-width:160px}
.card:hover{border-color:rgba(255,107,107,.4);transform:translateX(-6px);box-shadow:0 6px 25px rgba(255,107,107,.1)}
.card.selected{border-color:#ff6b6b;background:rgba(255,107,107,.1)}
.card .em{font-size:1.4rem;transition:transform .3s}
.card:hover .em{transform:scale(1.2) rotate(-5deg)}
.card .inf{text-align:left}
.card .nm{font-size:.8rem;font-weight:600;color:#fff}
.card .pr{font-size:.72rem;color:#00b894;margin-top:2px}

.bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:100}
.bar button{padding:8px 16px;border:1px solid rgba(255,255,255,.08);border-radius:10px;font-size:.78rem;cursor:pointer;font-weight:600;background:rgba(10,10,25,.88);color:#bbb;backdrop-filter:blur(10px);transition:all .3s}
.bar button:hover{background:rgba(255,255,255,.08);color:#fff}
.bar button.on{background:linear-gradient(135deg,#00b894,#00cec9);border-color:transparent;color:#fff}

.bubble{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(15px);background:rgba(10,10,25,.95);border:1px solid rgba(255,107,107,.3);border-radius:16px;padding:14px 22px;max-width:480px;min-width:260px;box-shadow:0 10px 35px rgba(0,0,0,.5);z-index:100;text-align:center;opacity:0;transition:all .4s;pointer-events:none}
.bubble.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bubble::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);border-width:12px;border-style:solid;border-color:rgba(10,10,25,.95) transparent transparent}
.bubble p{font-size:.85rem;color:#ddd;line-height:1.55}

.splash{position:fixed;inset:0;z-index:999;background:radial-gradient(ellipse at 50% 40%,#1a1a3a,#0a0a18,#050510);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .6s}
.splash.hide{opacity:0;pointer-events:none}
.splash h1{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,#ff6b6b,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;letter-spacing:3px}
.splash p{color:#444;font-size:.75rem;letter-spacing:5px;text-transform:uppercase;margin-bottom:30px}
.splash button{padding:14px 45px;background:linear-gradient(135deg,#ff6b6b,#ee5a24);border:none;border-radius:28px;color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .3s;box-shadow:0 8px 28px rgba(255,107,107,.35);letter-spacing:1.5px}
.splash button:hover{transform:scale(1.06);box-shadow:0 10px 38px rgba(255,107,107,.5)}

.loading{position:fixed;bottom:45px;left:50%;transform:translateX(-50%);background:rgba(0,184,148,.92);color:#fff;padding:7px 18px;border-radius:18px;font-size:.78rem;font-weight:600;z-index:300;display:none;align-items:center;gap:7px}
.loading.on{display:flex}
.loading::before{content:'';width:11px;height:11px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:700px){
.products{top:auto;bottom:55px;right:6px;flex-direction:row;flex-wrap:wrap;justify-content:flex-end}
.card{min-width:130px;padding:8px 12px}
.panel{top:auto;bottom:55px;left:6px}
}
</style>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ===== GLOBALS =====
let scene,camera,renderer,controls,clock;
let avatar,faceGroup,eyeL,eyeR,pupilL,pupilR,mouthObj,cherryObj;
let products=[],displayCases=[];
let selectedProduct=null,promoMode=false,promoTimer=null,promoIndex=0;
let voiceOn=true,rate=0.9,isTalking=false;
const S=window.speechSynthesis;
const EL_KEY='sk_112617f23620344b47cad6da36eaab66088582e8c18b7016';
const EL_VOICE='s91wgzodwL1wfwitqbIm';
const EL_MODEL='eleven_multilingual_v2';
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

// ===== PRODUCT DATA =====
const productData=[
    {id:'tarta',name:'Tarta de Fresa Celestial',price:'$35.000',desc:'Una exquisita tarta de fresa con crema batida fresca y una base crujiente. Decorada con fresas naturales y un toque de vainilla de Madagascar.',color:0xff6b8a,accent:0xffb6c1},
    {id:'cupcake',name:'Cupcake de Chocolate Divino',price:'$18.000',desc:'Un suave cupcake de chocolate con glaseado intenso y chispas de cacao belga. El favorito de nuestros clientes.',color:0x8b4513,accent:0xd2691e},
    {id:'macaron',name:'Macaron Arcoíris',price:'$12.000',desc:'Delicados macarons de colores variados, cada uno con un sabor único. Textura crujiente por fuera, suave por dentro.',color:0xff69b4,accent:0xba55d3},
    {id:'donut',name:'Donut Glaseado Clásico',price:'$8.000',desc:'El clásico donut glaseado, suave y esponjoso, ideal para acompañar tu café favorito.',color:0xffa500,accent:0xffd700}
];

// ===== INIT THREE.JS =====
function initThree(){
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x1a1520);
    scene.fog=new THREE.FogExp2(0x1a1520,0.02);
    
    camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
    camera.position.set(0,4,10);
    
    renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.1;
    document.body.prepend(renderer.domElement);
    
    controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;
    controls.dampingFactor=0.08;
    controls.enablePan=false;
    controls.minDistance=5;
    controls.maxDistance=18;
    controls.maxPolarAngle=Math.PI/1.9;
    controls.target.set(0,1.5,0);
    
    clock=new THREE.Clock();
    
    // Lighting
    scene.add(new THREE.AmbientLight(0x404060,0.5));
    
    const mainLight=new THREE.DirectionalLight(0xfff0e0,1.5);
    mainLight.position.set(5,10,5);
    mainLight.castShadow=true;
    mainLight.shadow.mapSize.set(2048,2048);
    mainLight.shadow.camera.near=0.5;
    mainLight.shadow.camera.far=30;
    mainLight.shadow.camera.left=-10;
    mainLight.shadow.camera.right=10;
    mainLight.shadow.camera.top=10;
    mainLight.shadow.camera.bottom=-10;
    scene.add(mainLight);
    
    const rimLight=new THREE.DirectionalLight(0xff6b6b,0.4);
    rimLight.position.set(-5,5,-5);
    scene.add(rimLight);
    
    const spotLight=new THREE.SpotLight(0xffffff,0.8);
    spotLight.position.set(0,8,0);
    spotLight.angle=Math.PI/4;
    spotLight.penumbra=0.5;
    spotLight.castShadow=true;
    scene.add(spotLight);
}

// ===== ENVIRONMENT =====
function createEnvironment(){
    // Floor
    const floorGeo=new THREE.PlaneGeometry(30,30);
    const floorMat=new THREE.MeshStandardMaterial({color:0x2a1f1a,roughness:0.8,metalness:0.1});
    const floor=new THREE.Mesh(floorGeo,floorMat);
    floor.rotation.x=-Math.PI/2;
    floor.position.y=-0.5;
    floor.receiveShadow=true;
    scene.add(floor);
    
    // Back wall
    const wallGeo=new THREE.PlaneGeometry(20,8);
    const wallMat=new THREE.MeshStandardMaterial({color:0x2d2535,roughness:0.9});
    const backWall=new THREE.Mesh(wallGeo,wallMat);
    backWall.position.set(0,3.5,-6);
    backWall.receiveShadow=true;
    scene.add(backWall);
    
    // Side walls
    const sideWallL=new THREE.Mesh(wallGeo,wallMat);
    sideWallL.position.set(-8,3.5,0);
    sideWallL.rotation.y=Math.PI/2;
    scene.add(sideWallL);
    
    const sideWallR=new THREE.Mesh(wallGeo,wallMat);
    sideWallR.position.set(8,3.5,0);
    sideWallR.rotation.y=-Math.PI/2;
    scene.add(sideWallR);
    
    // Wallpaper pattern (subtle vertical stripes)
    const stripeMat=new THREE.MeshStandardMaterial({color:0x322a3e,roughness:0.85});
    for(let i=-9;i<10;i+=2){
        const stripe=new THREE.Mesh(new THREE.PlaneGeometry(0.08,8),stripeMat);
        stripe.position.set(i,3.5,-5.98);
        scene.add(stripe);
    }
    
    // Decorative shelf on back wall
    const shelfGeo=new THREE.BoxGeometry(6,0.1,0.4);
    const shelfMat=new THREE.MeshStandardMaterial({color:0x5a4a3a,roughness:0.6});
    const shelf=new THREE.Mesh(shelfGeo,shelfMat);
    shelf.position.set(0,3,-5.7);
    scene.add(shelf);
    
    // Vases on shelf
    const vaseMat=new THREE.MeshStandardMaterial({color:0xd4a574,roughness:0.4,metalness:0.15});
    const vasePositions=[-2.2,-1.1,0,1.1,2.2];
    vasePositions.forEach(x=>{
        const vase=new THREE.Group();
        const body=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.12,0.25,12),vaseMat);
        body.position.y=0.125;vase.add(body);
        const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.06,0.1,12),vaseMat);
        neck.position.y=0.3;vase.add(neck);
        const lip=new THREE.Mesh(new THREE.TorusGeometry(0.05,0.012,8,16),vaseMat);
        lip.position.y=0.35;lip.rotation.x=Math.PI/2;vase.add(lip);
        vase.position.set(x,3.05,-5.5);
        scene.add(vase);
    });
    
    // Small potted plant on shelf
    const potMat=new THREE.MeshStandardMaterial({color:0x8b6f47,roughness:0.6});
    const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.08,0.12,12),potMat);
    pot.position.set(0,3.1,-5.5);scene.add(pot);
    const leafMat=new THREE.MeshStandardMaterial({color:0x4a7a3a,roughness:0.5});
    for(let i=0;i<5;i++){
        const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8),leafMat);
        leaf.scale.set(0.5,1.5,0.5);
        const a=(i/5)*Math.PI*2;
        leaf.position.set(Math.cos(a)*0.08,3.22,Math.sin(a)*0.08-5.5);
        scene.add(leaf);
    }
    
    // Display cases
    createDisplayCases();
}

function createDisplayCases(){
    const caseMat=new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:0.15,roughness:0.05,metalness:0.1,transmission:0.8});
    const frameMat=new THREE.MeshStandardMaterial({color:0x3a3a4a,roughness:0.4,metalness:0.6});
    
    // Main display (center)
    const mainCase=createDisplayCase(caseMat,frameMat,2.5,1.2,1.5);
    mainCase.position.set(0,0.1,0);
    mainCase.name='mainCase';
    scene.add(mainCase);
    displayCases.push(mainCase);
    
    // Secondary displays
    const positions=[{x:-3.5,z:1},{x:3.5,z:1},{x:-2,z:2.5},{x:2,z:2.5}];
    positions.forEach((pos,i)=>{
        const secCase=createDisplayCase(caseMat,frameMat,1.5,0.8,1);
        secCase.position.set(pos.x,0.1,pos.z);
        secCase.name='secCase'+i;
        scene.add(secCase);
        displayCases.push(secCase);
    });
}

function createDisplayCase(caseMat,frameMat,w,h,d){
    const group=new THREE.Group();
    
    // Glass box
    const glassGeo=new THREE.BoxGeometry(w,h,d);
    const glass=new THREE.Mesh(glassGeo,caseMat);
    glass.position.y=h/2+0.05;
    group.add(glass);
    
    // Frame
    const frameGeo=new THREE.BoxGeometry(w+0.05,0.05,d+0.05);
    const frameTop=new THREE.Mesh(frameGeo,frameMat);
    frameTop.position.y=h+0.05;
    group.add(frameTop);
    
    const frameBot=new THREE.Mesh(frameGeo,frameMat);
    frameBot.position.y=0.05;
    group.add(frameBot);
    
    // Internal light
    const innerLight=new THREE.PointLight(0xfff5e6,0.4,3);
    innerLight.position.y=h;
    group.add(innerLight);
    
    return group;
}

// ===== PRODUCTS 3D =====
function createProducts(){
    productData.forEach((data,i)=>{
        const product=createProductModel(data);
        product.userData={...data,index:i};
        
        // Position in secondary cases
        const caseIndex=i+1;
        if(displayCases[caseIndex]){
            const casePos=displayCases[caseIndex].position;
            product.position.set(casePos.x,0.9,casePos.z);
        }
        
        product.castShadow=true;
        product.name='product'+i;
        scene.add(product);
        products.push(product);
    });
}

function createProductModel(data){
    const group=new THREE.Group();
    const mat=new THREE.MeshStandardMaterial({color:data.color,roughness:0.3,metalness:0.1});
    const matAccent=new THREE.MeshStandardMaterial({color:data.accent,roughness:0.25,metalness:0.05});
    
    switch(data.id){
        case'tarta':
            // Base
            const base=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.55,0.15,32),mat);
            base.position.y=0.075;
            group.add(base);
            // Cream layer
            const cream=new THREE.Mesh(new THREE.CylinderGeometry(0.48,0.5,0.1,32),matAccent);
            cream.position.y=0.2;
            group.add(cream);
            // Top
            const top=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.48,0.12,32),mat);
            top.position.y=0.31;
            group.add(top);
            // Strawberry
            const berry=new THREE.Mesh(new THREE.SphereGeometry(0.08,16,16),new THREE.MeshStandardMaterial({color:0xff2244,roughness:0.3}));
            berry.position.y=0.42;
            group.add(berry);
            break;
            
        case'cupcake':
            // Cup
            const cup=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,0.25,16),new THREE.MeshStandardMaterial({color:0xf5deb3,roughness:0.6}));
            cup.position.y=0.125;
            group.add(cup);
            // Frosting
            const frost=new THREE.Mesh(new THREE.ConeGeometry(0.25,0.3,16),mat);
            frost.position.y=0.4;
            group.add(frost);
            // Cherry on top
            const cherry=new THREE.Mesh(new THREE.SphereGeometry(0.05,12,12),new THREE.MeshStandardMaterial({color:0xff0000,roughness:0.2}));
            cherry.position.y=0.58;
            group.add(cherry);
            break;
            
        case'macaron':
            // Top shell
            const shellTop=new THREE.Mesh(new THREE.SphereGeometry(0.2,24,12,0,Math.PI*2,0,Math.PI/2),mat);
            shellTop.position.y=0.22;
            shellTop.rotation.x=Math.PI;
            group.add(shellTop);
            // Bottom shell
            const shellBot=new THREE.Mesh(new THREE.SphereGeometry(0.2,24,12,0,Math.PI*2,0,Math.PI/2),mat);
            shellBot.position.y=0.18;
            group.add(shellBot);
            // Filling
            const filling=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,0.04,24),matAccent);
            filling.position.y=0.2;
            group.add(filling);
            break;
            
        case'donut':
            // Donut body
            const donut=new THREE.Mesh(new THREE.TorusGeometry(0.22,0.1,16,32),mat);
            donut.position.y=0.15;
            donut.rotation.x=Math.PI/2;
            group.add(donut);
            // Glaze
            const glaze=new THREE.Mesh(new THREE.TorusGeometry(0.22,0.08,16,32),matAccent);
            glaze.position.y=0.18;
            glaze.rotation.x=Math.PI/2;
            group.add(glaze);
            break;
    }
    
    return group;
}

// ===== AVATAR =====
function createAvatar(){
    avatar=new THREE.Group();
    
    const matBase=new THREE.MeshStandardMaterial({color:0xf5a623,roughness:0.4});
    const matMid=new THREE.MeshStandardMaterial({color:0xffe8d0,roughness:0.35});
    const matTop=new THREE.MeshStandardMaterial({color:0xff9ab0,roughness:0.3});
    const matCherry=new THREE.MeshStandardMaterial({color:0xe74c3c,roughness:0.2,metalness:0.15});
    const matArm=new THREE.MeshStandardMaterial({color:0xffb0c0,roughness:0.4});
    
    // Body layers
    const base=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.75,0.5,32),matBase);
    base.position.y=0.25;base.castShadow=true;avatar.add(base);
    
    const mid=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.65,0.35,32),matMid);
    mid.position.y=0.68;mid.castShadow=true;avatar.add(mid);
    
    const top=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.55,0.3,32),matTop);
    top.position.y=1.0;top.castShadow=true;avatar.add(top);
    
    // Cherry
    cherryObj=new THREE.Mesh(new THREE.SphereGeometry(0.1,16,16),matCherry);
    cherryObj.position.y=1.25;cherryObj.castShadow=true;avatar.add(cherryObj);
    
    // Face
    faceGroup=new THREE.Group();
    faceGroup.position.set(0,0.6,0.65);
    
    // Eyes
    eyeL=createEye();eyeL.position.set(-0.18,0.08,0);faceGroup.add(eyeL);
    eyeR=createEye();eyeR.position.set(0.18,0.08,0);faceGroup.add(eyeR);
    pupilL=eyeL.getObjectByName('pupil');
    pupilR=eyeR.getObjectByName('pupil');
    
    // Mouth
    mouthObj=new THREE.Mesh(new THREE.SphereGeometry(0.06,16,8,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0xe74c3c,roughness:0.3}));
    mouthObj.rotation.x=Math.PI;mouthObj.position.set(0,-0.1,0.01);
    faceGroup.add(mouthObj);
    
    avatar.add(faceGroup);
    
    // Arms
    const armGeo=new THREE.CapsuleGeometry(0.04,0.25,8,12);
    const armL=new THREE.Mesh(armGeo,matArm);armL.position.set(-0.8,0.6,0.2);armL.rotation.z=0.4;armL.name='armL';avatar.add(armL);
    const armR=new THREE.Mesh(armGeo,matArm);armR.position.set(0.8,0.6,0.2);armR.rotation.z=-0.4;armR.name='armR';avatar.add(armR);
    
    avatar.position.set(-2,0,2);
    avatar.name='avatar';
    scene.add(avatar);
}

function createEye(){
    const g=new THREE.Group();
    const white=new THREE.Mesh(new THREE.SphereGeometry(0.08,16,16),new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.1}));
    white.scale.set(1,1.1,0.7);g.add(white);
    const iris=new THREE.Mesh(new THREE.CircleGeometry(0.04,16),new THREE.MeshStandardMaterial({color:0x4a3a2a,roughness:0.15}));
    iris.position.z=0.055;g.add(iris);
    const pupil=new THREE.Mesh(new THREE.CircleGeometry(0.02,16),new THREE.MeshStandardMaterial({color:0x111111}));
    pupil.position.z=0.06;pupil.name='pupil';g.add(pupil);
    const ref=new THREE.Mesh(new THREE.CircleGeometry(0.008,8),new THREE.MeshBasicMaterial({color:0xffffff}));
    ref.position.set(-0.01,0.01,0.065);g.add(ref);
    return g;
}

// ===== ANIMATION =====
let breathPhase=0,blinkTimer=0,nextBlink=2+Math.random()*4,mouthPhase=0;

function animate(){
    requestAnimationFrame(animate);
    const dt=clock.getDelta();
    const t=clock.getElapsedTime();
    
    breathPhase+=dt*1.5;
    blinkTimer+=dt;
    
    if(avatar){
        // Breathing
        avatar.position.y=Math.sin(breathPhase)*0.02;
        avatar.rotation.z=Math.sin(breathPhase*0.7)*0.015;
        
        // Blink
        if(blinkTimer>nextBlink){
            blinkTimer=0;nextBlink=2+Math.random()*4;
            blink();
        }
        
        // Mouth when talking
        if(isTalking){
            mouthPhase+=dt*14;
            if(mouthObj){
                const s=0.7+Math.sin(mouthPhase)*0.5;
                mouthObj.scale.set(s,1+Math.sin(mouthPhase*1.3)*0.4,1);
            }
        }else{
            if(mouthObj){mouthObj.scale.set(1,1,1)}
        }
        
        // Cherry bob
        if(cherryObj){
            cherryObj.position.y=1.25+Math.sin(t*1.5)*0.015;
        }
        
        // Arm idle
        const armL=avatar.getObjectByName('armL');
        const armR=avatar.getObjectByName('armR');
        if(armL)armL.rotation.z=0.4+Math.sin(t*0.8)*0.04;
        if(armR)armR.rotation.z=-0.4+Math.sin(t*0.8+1)*0.04;
        
        // Look at selected product
        if(selectedProduct&&faceGroup){
            const target=selectedProduct.position.clone();
            target.y=faceGroup.getWorldPosition(new THREE.Vector3()).y;
            faceGroup.lookAt(target);
        }
    }
    
    // Product hover glow
    products.forEach(p=>{
        if(p===selectedProduct){
            p.position.y+=(0.95-p.position.y)*0.1;
        }else{
            p.position.y+=(0.9-p.position.y)*0.1;
        }
    });
    
    controls.update();
    renderer.render(scene,camera);
}

function blink(){
    if(!eyeL||!eyeR)return;
    let frame=0;
    const anim=()=>{
        frame++;
        const s=frame<=5?1-frame/5:frame<=10?(frame-5)/5:1;
        eyeL.scale.y=Math.max(0.1,s);
        eyeR.scale.y=Math.max(0.1,s);
        if(frame<10)requestAnimationFrame(anim);
    };
    anim();
}

// ===== INTERACTION =====
function onMouseMove(e){
    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;
    
    raycaster.setFromCamera(mouse,camera);
    const intersects=raycaster.intersectObjects(products,true);
    
    document.body.style.cursor=intersects.length>0?'pointer':'default';
}

function onClick(e){
    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;
    
    raycaster.setFromCamera(mouse,camera);
    const intersects=raycaster.intersectObjects(products,true);
    
    if(intersects.length>0){
        let obj=intersects[0].object;
        while(obj.parent&&!obj.userData.id)obj=obj.parent;
        if(obj.userData.id)selectProduct(obj);
    }
}

function selectProduct(product){
    selectedProduct=product;
    const data=product.userData;
    
    // Update UI
    document.getElementById('infoName').textContent=data.name;
    document.getElementById('infoPrice').textContent=data.price;
    document.getElementById('infoDesc').textContent=data.desc;
    document.getElementById('infoPanel').classList.add('show');
    
    // Update cards
    document.querySelectorAll('.card').forEach((c,i)=>{
        c.classList.toggle('selected',i===data.index);
    });
    
    // Move to main display
    const mainCase=displayCases[0];
    if(mainCase){
        const targetPos=mainCase.position.clone();
        targetPos.y=0.9;
        animateProductTo(product,targetPos);
    }
    
    // Avatar looks at product and speaks
    speak(data.name+'. '+data.desc+'. Precio: '+data.price+' pesos colombianos.');
}

function animateProductTo(product,target){
    const start=product.position.clone();
    const duration=800;
    const st=Date.now();
    (function anim(){
        const t=Math.min((Date.now()-st)/duration,1);
        const ease=1-Math.pow(1-t,3);
        product.position.lerpVectors(start,target,ease);
        if(t<1)requestAnimationFrame(anim);
    })();
}

// ===== VOICE =====
async function speakEL(txt){
    document.getElementById('loading').classList.add('on');
    try{
        const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${EL_VOICE}`,{
            method:'POST',
            headers:{'Content-Type':'application/json','xi-api-key':EL_KEY},
            body:JSON.stringify({text:txt,model_id:EL_MODEL,voice_settings:{stability:0.5,similarity_boost:0.75}})
        });
        if(!r.ok)throw new Error(r.status);
        const blob=await r.blob();
        const url=URL.createObjectURL(blob);
        const audio=new Audio(url);
        document.getElementById('loading').classList.remove('on');
        audio.onplay=()=>{isTalking=true;showBubble(txt)};
        audio.onended=()=>{isTalking=false;hideBubble();URL.revokeObjectURL(url)};
        audio.onerror=()=>{document.getElementById('loading').classList.remove('on');speakFB(txt)};
        await audio.play();
    }catch(e){document.getElementById('loading').classList.remove('on');speakFB(txt)}
}

function speakFB(txt){
    if(!S){showBubble(txt);return}
    S.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='es-ES';u.rate=rate;u.pitch=1.05;u.volume=1;
    const vs=S.getVoices();
    const p=['Microsoft Sabina','Microsoft Helena','Google español','Paulina','es-ES'];
    let v=null;for(const n of p){v=vs.find(x=>x.name.includes(n));if(v)break}
    if(!v)v=vs.find(x=>x.lang.startsWith('es'));
    if(v)u.voice=v;
    u.onstart=()=>{isTalking=true;showBubble(txt)};
    u.onend=()=>{isTalking=false;hideBubble()};
    S.speak(u);
}

function speak(txt){if(!voiceOn){showBubble(txt);return}if(EL_KEY&&EL_VOICE){speakEL(txt);return}speakFB(txt)}

// ===== UI =====
function showBubble(t){document.getElementById('bubbleText').textContent=t;document.getElementById('bubble').classList.add('show')}
function hideBubble(){document.getElementById('bubble').classList.remove('show')}

function createProductCards(){
    const container=document.getElementById('productCards');
    productData.forEach((data,i)=>{
        const card=document.createElement('div');
        card.className='card';
        card.innerHTML=`<span class="em">${data.id==='tarta'?'🍰':data.id==='cupcake'?'🧁':data.id==='macaron'?'🍬':'🍩'}</span><div class="inf"><div class="nm">${data.name}</div><div class="pr">${data.price}</div></div>`;
        card.onclick=()=>selectProduct(products[i]);
        container.appendChild(card);
    });
}

// ===== PROMO MODE =====
window.togglePromo=function(){
    promoMode=!promoMode;
    const btn=document.getElementById('promoBtn');
    btn.className=promoMode?'btn active':'btn';
    
    if(promoMode){
        promoIndex=0;
        showNextPromo();
    }else{
        clearTimeout(promoTimer);
    }
};

function showNextPromo(){
    if(!promoMode)return;
    const data=productData[promoIndex];
    selectProduct(products[promoIndex]);
    speak(data.name+'. '+data.price+' pesos colombianos.');
    promoIndex=(promoIndex+1)%productData.length;
    promoTimer=setTimeout(showNextPromo,10000);
}

// ===== CONTROLS =====
window.toggleVoice=function(){
    voiceOn=!voiceOn;
    const b=document.getElementById('voiceBtn');
    b.className=voiceOn?'on':'';
    b.textContent=voiceOn?'🔊 Voz':'🔇 Mute';
    if(!voiceOn){S&&S.cancel();isTalking=false;hideBubble()}
};

window.resetCamera=function(){
    controls.target.set(0,1.5,0);
    camera.position.set(0,4,10);
};

window.resetView=function(){
    selectedProduct=null;
    document.getElementById('infoPanel').classList.remove('show');
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
    products.forEach((p,i)=>{
        const caseIndex=i+1;
        if(displayCases[caseIndex]){
            const pos=displayCases[caseIndex].position;
            animateProductTo(p,new THREE.Vector3(pos.x,0.9,pos.z));
        }
    });
    if(faceGroup)faceGroup.rotation.y=0;
};

window.greet=function(){speak('¡Hola! Bienvenido a nuestra tienda de postres. Selecciona un producto del menú.')};

// ===== START =====
document.getElementById('startBtn').onclick=()=>{
    document.getElementById('splash').classList.add('hide');
    setTimeout(()=>{
        document.getElementById('splash').remove();
        speak('¡Bienvenido a Chef Byte! Esta es nuestra tienda de postres 3D. Selecciona cualquier postre de la vitrina para conocerlo.');
    },700);
};

initThree();
createEnvironment();
createProducts();
createAvatar();
createProductCards();

renderer.domElement.addEventListener('mousemove',onMouseMove);
renderer.domElement.addEventListener('click',onClick);

animate();

window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});
</script>
