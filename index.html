<style>

body{font-family:'Segoe UI',system-ui,sans-serif;background:#080810;overflow:hidden;color:#fff}

.splash button{padding:14px 45px;background:linear-gradient(135deg,#ff6b6b,#ee5a24);border:none;border-radius:28px;color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .3s;box-shadow:0 8px 28px rgba(255,107,107,.35);letter-spacing:1.5px}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ===== GLOBALS =====
let scene,camera,renderer,controls,clock;
let avatar,faceGroup,eyeL,eyeR,pupilL,pupilR,mouthObj,cherryObj;
let products=[],displayCases=[];
let selectedProduct=null,promoMode=false,promoTimer=null,promoIndex=0;
let voiceOn=true,rate=0.9,isTalking=false;
const S=window.speechSynthesis;
const EL_KEY='sk_112617f23620344b47cad6da36eaab66088582e8c18b7016';
const EL_VOICE='s91wgzodwL1wfwitqbIm';
const EL_MODEL='eleven_multilingual_v2';
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

// ===== PRODUCT DATA =====
const productData=[
    {id:'tarta',name:'Tarta de Fresa Celestial',price:'$35.000',desc:'Una exquisita tarta de fresa con crema batida fresca y una base crujiente. Decorada con fresas naturales y un toque de vainilla de Madagascar.',color:0xff6b8a,accent:0xffb6c1},
    {id:'cupcake',name:'Cupcake de Chocolate Divino',price:'$18.000',desc:'Un suave cupcake de chocolate con glaseado intenso y chispas de cacao belga. El favorito de nuestros clientes.',color:0x8b4513,accent:0xd2691e},
    {id:'macaron',name:'Macaron Arcoíris',price:'$12.000',desc:'Delicados macarons de colores variados, cada uno con un sabor único. Textura crujiente por fuera, suave por dentro.',color:0xff69b4,accent:0xba55d3},
    {id:'donut',name:'Donut Glaseado Clásico',price:'$8.000',desc:'El clásico donut glaseado, suave y esponjoso, ideal para acompañar tu café favorito.',color:0xffa500,accent:0xffd700}
];

// ===== INIT THREE.JS =====
function initThree(){
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x1a1520);
    scene.fog=new THREE.FogExp2(0x1a1520,0.018);

    camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
    camera.position.set(0,4,10);

    renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.1;
    document.body.prepend(renderer.domElement);

    controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;
    controls.dampingFactor=0.08;
    controls.enablePan=false;
    controls.minDistance=5;
    controls.maxDistance=18;
    controls.maxPolarAngle=Math.PI/1.9;
    controls.target.set(0,1.5,0);

    clock=new THREE.Clock();

    // Lighting
    scene.add(new THREE.AmbientLight(0x404060,0.5));

    const mainLight=new THREE.DirectionalLight(0xfff0e0,1.5);
    mainLight.position.set(5,10,5);
    mainLight.castShadow=true;
    mainLight.shadow.mapSize.set(2048,2048);
    mainLight.shadow.camera.near=0.5;
    mainLight.shadow.camera.far=30;
    mainLight.shadow.camera.left=-10;
    mainLight.shadow.camera.right=10;
    mainLight.shadow.camera.top=10;
    mainLight.shadow.camera.bottom=-10;
    scene.add(mainLight);

    const rimLight=new THREE.DirectionalLight(0xff6b6b,0.4);
    rimLight.position.set(-5,5,-5);
    scene.add(rimLight);

    const spotLight=new THREE.SpotLight(0xffffff,0.8);
    spotLight.position.set(0,8,0);
    spotLight.angle=Math.PI/4;
    spotLight.penumbra=0.5;
    spotLight.castShadow=true;
    scene.add(spotLight);

    // Additional fill lights for vitrinas
    const fillL=new THREE.PointLight(0xffeecc,0.3,8);
    fillL.position.set(-4,3,1);
    scene.add(fillL);

    const fillR=new THREE.PointLight(0xffeecc,0.3,8);
    fillR.position.set(4,3,1);
    scene.add(fillR);
}

// ===== ENVIRONMENT =====
function createEnvironment(){
    // Floor - wooden planks pattern
    const floorGeo=new THREE.PlaneGeometry(30,30);
    const floorMat=new THREE.MeshStandardMaterial({color:0x3a2820,roughness:0.7,metalness:0.05});
    const floor=new THREE.Mesh(floorGeo,floorMat);
    floor.rotation.x=-Math.PI/2;
    floor.position.y=-0.5;
    floor.receiveShadow=true;
    scene.add(floor);

    // Floor plank lines
    const plankMat=new THREE.MeshStandardMaterial({color:0x2a1c14,roughness:0.9});
    for(let i=-14;i<15;i+=1.5){
        const plank=new THREE.Mesh(new THREE.PlaneGeometry(0.03,30),plankMat);
        plank.rotation.x=-Math.PI/2;
        plank.position.set(i,-0.49,0);
        scene.add(plank);
    }

    // Back wall - pastel pink
    const wallGeo=new THREE.PlaneGeometry(20,8);
    const wallMat=new THREE.MeshStandardMaterial({color:0x3d2e3a,roughness:0.9});
    const backWall=new THREE.Mesh(wallGeo,wallMat);
    backWall.position.set(0,3.5,-6);
    backWall.receiveShadow=true;
    scene.add(backWall);

    // Side walls
    const sideWallL=new THREE.Mesh(wallGeo,wallMat);
    sideWallL.position.set(-8,3.5,0);
    sideWallL.rotation.y=Math.PI/2;
    scene.add(sideWallL);

    const sideWallR=new THREE.Mesh(wallGeo,wallMat);
    sideWallR.position.set(8,3.5,0);
    sideWallR.rotation.y=-Math.PI/2;
    scene.add(sideWallR);

    // Wallpaper pattern - vertical stripes (pastel tones)
    const stripeMat=new THREE.MeshStandardMaterial({color:0x4a3848,roughness:0.85});
    for(let i=-9;i<10;i+=2){
        const stripe=new THREE.Mesh(new THREE.PlaneGeometry(0.12,8),stripeMat);
        stripe.position.set(i,3.5,-5.97);
        scene.add(stripe);
    }

    // Decorative moldings on back wall
    const moldingMat=new THREE.MeshStandardMaterial({color:0x5a4a4a,roughness:0.5,metalness:0.1});
    const topMolding=new THREE.Mesh(new THREE.BoxGeometry(16,0.12,0.15),moldingMat);
    topMolding.position.set(0,7.2,-5.9);
    scene.add(topMolding);

    const botMolding=new THREE.Mesh(new THREE.BoxGeometry(16,0.12,0.15),moldingMat);
    botMolding.position.set(0,0.1,-5.9);
    scene.add(botMolding);

    // Shelves on back wall
    const shelfMat=new THREE.MeshStandardMaterial({color:0x6a5a4a,roughness:0.5,metalness:0.1});

    // Upper shelf
    const shelf1=new THREE.Mesh(new THREE.BoxGeometry(8,0.08,0.35),shelfMat);
    shelf1.position.set(0,4.5,-5.75);
    scene.add(shelf1);

    // Lower shelf
    const shelf2=new THREE.Mesh(new THREE.BoxGeometry(6,0.08,0.35),shelfMat);
    shelf2.position.set(0,2.8,-5.75);
    scene.add(shelf2);

    // Vases on upper shelf
    const vaseMat=new THREE.MeshStandardMaterial({color:0xd4a574,roughness:0.35,metalness:0.15});
    const vasePositions1=[-3,-1.5,0,1.5,3];
    vasePositions1.forEach(x=>{
        const vase=new THREE.Group();
        const body=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.1,0.2,12),vaseMat);
        body.position.y=0.1;vase.add(body);
        const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.05,0.08,12),vaseMat);
        neck.position.y=0.24;vase.add(neck);
        const lip=new THREE.Mesh(new THREE.TorusGeometry(0.04,0.01,8,16),vaseMat);
        lip.position.y=0.28;lip.rotation.x=Math.PI/2;vase.add(lip);
        vase.position.set(x,4.54,-5.55);
        scene.add(vase);
    });

    // Books on lower shelf
    const bookColors=[0xc0392b,0x2980b9,0x27ae60,0xf39c12,0x8e44ad];
    bookColors.forEach((c,i)=>{
        const bookMat=new THREE.MeshStandardMaterial({color:c,roughness:0.6});
        const book=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.22,0.08),bookMat);
        book.position.set(-2+i*1,2.91,-5.6);
        book.rotation.z=0.05*(i%2===0?1:-1);
        scene.add(book);
    });

    // Potted plant on lower shelf
    const potMat=new THREE.MeshStandardMaterial({color:0x8b6f47,roughness:0.55});
    const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.09,0.15,12),potMat);
    pot.position.set(0,2.88,-5.55);scene.add(pot);
    const leafMat=new THREE.MeshStandardMaterial({color:0x3a7a2a,roughness:0.45});
    for(let i=0;i<7;i++){
        const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),leafMat);
        leaf.scale.set(0.4,1.8,0.4);
        const a=(i/7)*Math.PI*2;
        const r=0.07;
        leaf.position.set(Math.cos(a)*r,3.02,Math.sin(a)*r-5.55);
        leaf.rotation.z=Math.cos(a)*0.3;
        scene.add(leaf);
    }

    // Ceiling lamp
    const lampMat=new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:0.3,metalness:0.6});
    const lampCord=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,1,8),lampMat);
    lampCord.position.set(0,7,0);scene.add(lampCord);
    const lampShade=new THREE.Mesh(new THREE.ConeGeometry(0.4,0.3,16,1,true),new THREE.MeshStandardMaterial({color:0xffe0c0,roughness:0.4,side:THREE.DoubleSide}));
    lampShade.position.set(0,6.4,0);lampShade.rotation.x=Math.PI;scene.add(lampShade);
    const lampLight=new THREE.PointLight(0xffeedd,0.6,12);
    lampLight.position.set(0,6.3,0);scene.add(lampLight);

    // Display cases
    createDisplayCases();
}

function createDisplayCases(){
    const caseMat=new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:0.12,roughness:0.05,metalness:0.1,transmission:0.85,thickness:0.5});
    const frameMat=new THREE.MeshStandardMaterial({color:0x3a3a4a,roughness:0.35,metalness:0.65});

    // Main display (center) - larger and highlighted
    const mainCase=createDisplayCase(caseMat,frameMat,2.8,1.3,1.6,true);
    mainCase.position.set(0,0.1,0);
    mainCase.name='mainCase';
    scene.add(mainCase);
    displayCases.push(mainCase);

    // Secondary displays
    const secPositions=[{x:-3.5,z:1.2},{x:3.5,z:1.2},{x:-2,z:2.8},{x:2,z:2.8}];
    secPositions.forEach((pos,i)=>{
        const secCase=createDisplayCase(caseMat,frameMat,1.6,0.9,1.1,false);
        secCase.position.set(pos.x,0.1,pos.z);
        secCase.name='secCase'+i;
        scene.add(secCase);
        displayCases.push(secCase);
    });
}

function createDisplayCase(caseMat,frameMat,w,h,d,isMain){
    const group=new THREE.Group();

    // Glass box
    const glassGeo=new THREE.BoxGeometry(w,h,d);
    const glass=new THREE.Mesh(glassGeo,caseMat);
    glass.position.y=h/2+0.05;
    group.add(glass);

    // Frame - top and bottom
    const frameGeo=new THREE.BoxGeometry(w+0.06,0.06,d+0.06);
    const frameTop=new THREE.Mesh(frameGeo,frameMat);
    frameTop.position.y=h+0.05;
    group.add(frameTop);

    const frameBot=new THREE.Mesh(frameGeo,frameMat);
    frameBot.position.y=0.05;
    group.add(frameBot);

    // Frame - vertical edges
    const edgeGeo=new THREE.BoxGeometry(0.06,h,0.06);
    const edges=[[-w/2,-d/2],[w/2,-d/2],[-w/2,d/2],[w/2,d/2]];
    edges.forEach(([x,z])=>{
        const edge=new THREE.Mesh(edgeGeo,frameMat);
        edge.position.set(x,h/2+0.05,z);
        group.add(edge);
    });

    // Internal light
    const innerLight=new THREE.PointLight(isMain?0xfff5e6:0xffeedd,isMain?0.6:0.3,3);
    innerLight.position.y=h;
    group.add(innerLight);

    // Spot light for main case
    if(isMain){
        const mainSpot=new THREE.SpotLight(0xffffff,0.8,5,Math.PI/6,0.5);
        mainSpot.position.set(0,h+1,0);
        mainSpot.target.position.set(0,0,0);
        group.add(mainSpot);
        group.add(mainSpot.target);
    }

    // Base pedestal
    const pedMat=new THREE.MeshStandardMaterial({color:0x2a2a3a,roughness:0.3,metalness:0.4});
    const pedestal=new THREE.Mesh(new THREE.BoxGeometry(w+0.1,0.08,d+0.1),pedMat);
    pedestal.position.y=0.01;
    group.add(pedestal);

    return group;
}

// ===== PRODUCTS 3D =====
function createProducts(){
    productData.forEach((data,i)=>{
        const product=createProductModel(data);
        product.userData={...data,index:i};

        // Position in secondary cases
        const caseIndex=i+1;
        if(displayCases[caseIndex]){
            const casePos=displayCases[caseIndex].position;
            product.position.set(casePos.x,0.9,casePos.z);
        }

        product.castShadow=true;
        product.name='product'+i;
        scene.add(product);
        products.push(product);
    });
}

function createProductModel(data){
    const group=new THREE.Group();
    const mat=new THREE.MeshStandardMaterial({color:data.color,roughness:0.3,metalness:0.1});
    const matAccent=new THREE.MeshStandardMaterial({color:data.accent,roughness:0.25,metalness:0.05});

    switch(data.id){
        case'tarta':{
            // Base layer
            const base=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.5,0.12,32),mat);
            base.position.y=0.06;base.castShadow=true;group.add(base);
            // Cream layer
            const cream=new THREE.Mesh(new THREE.CylinderGeometry(0.43,0.45,0.08,32),matAccent);
            cream.position.y=0.16;group.add(cream);
            // Middle layer
            const mid=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.43,0.1,32),new THREE.MeshStandardMaterial({color:0xff8a9a,roughness:0.3}));
            mid.position.y=0.25;group.add(mid);
            // Top icing
            const icing=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.4,0.06,32),new THREE.MeshStandardMaterial({color:0xffc0cb,roughness:0.2}));
            icing.position.y=0.33;group.add(icing);
            // Strawberry on top
            const berry=new THREE.Mesh(new THREE.SphereGeometry(0.07,16,16),new THREE.MeshStandardMaterial({color:0xff2244,roughness:0.25}));
            berry.position.y=0.42;berry.castShadow=true;group.add(berry);
            // Leaf on strawberry
            const leafG=new THREE.Mesh(new THREE.ConeGeometry(0.03,0.04,4),new THREE.MeshStandardMaterial({color:0x228b22,roughness:0.4}));
            leafG.position.y=0.48;leafG.rotation.z=0.3;group.add(leafG);
            break;
        }
        case'cupcake':{
            // Cup
            const cup=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.25,0.22,16),new THREE.MeshStandardMaterial({color:0xf5deb3,roughness:0.55}));
            cup.position.y=0.11;cup.castShadow=true;group.add(cup);
            // Cup ridges
            for(let i=0;i<12;i++){
                const ridge=new THREE.Mesh(new THREE.BoxGeometry(0.008,0.2,0.01),new THREE.MeshStandardMaterial({color:0xe8d5b0,roughness:0.5}));
                const a=(i/12)*Math.PI*2;
                ridge.position.set(Math.cos(a)*0.21,0.11,Math.sin(a)*0.21);
                ridge.rotation.y=a;
                group.add(ridge);
            }
            // Frosting swirl
            const frost=new THREE.Mesh(new THREE.ConeGeometry(0.22,0.28,16),mat);
            frost.position.y=0.37;frost.castShadow=true;group.add(frost);
            // Cherry
            const cherry=new THREE.Mesh(new THREE.SphereGeometry(0.04,12,12),new THREE.MeshStandardMaterial({color:0xff0000,roughness:0.2,metalness:0.1}));
            cherry.position.y=0.54;group.add(cherry);
            break;
        }
        case'macaron':{
            // Top shell
            const shellTop=new THREE.Mesh(new THREE.SphereGeometry(0.18,24,12,0,Math.PI*2,0,Math.PI/2),mat);
            shellTop.position.y=0.2;shellTop.rotation.x=Math.PI;shellTop.castShadow=true;group.add(shellTop);
            // Bottom shell
            const shellBot=new THREE.Mesh(new THREE.SphereGeometry(0.18,24,12,0,Math.PI*2,0,Math.PI/2),mat);
            shellBot.position.y=0.16;group.add(shellBot);
            // Filling
            const filling=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.04,24),matAccent);
            filling.position.y=0.18;group.add(filling);
            // Feet texture (ruffled edge)
            const feet=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.015,8,24),new THREE.MeshStandardMaterial({color:data.accent,roughness:0.4}));
            feet.position.y=0.18;feet.rotation.x=Math.PI/2;group.add(feet);
            break;
        }
        case'donut':{
            // Donut body
            const donut=new THREE.Mesh(new THREE.TorusGeometry(0.2,0.09,16,32),mat);
            donut.position.y=0.12;donut.rotation.x=Math.PI/2;donut.castShadow=true;group.add(donut);
            // Glaze on top half
            const glaze=new THREE.Mesh(new THREE.TorusGeometry(0.2,0.075,16,32,Math.PI),matAccent);
            glaze.position.y=0.14;glaze.rotation.x=Math.PI/2;group.add(glaze);
            // Sprinkles
            const sprinkleColors=[0xff0000,0x00ff00,0x0000ff,0xffff00,0xff00ff];
            for(let i=0;i<12;i++){
                const sc=sprinkleColors[i%5];
                const sprinkle=new THREE.Mesh(new THREE.BoxGeometry(0.008,0.025,0.008),new THREE.MeshStandardMaterial({color:sc,roughness:0.3}));
                const a=(i/12)*Math.PI*2;
                const r=0.2;
                sprinkle.position.set(Math.cos(a)*r,0.19,Math.sin(a)*r);
                sprinkle.rotation.set(Math.random(),Math.random(),Math.random());
                group.add(sprinkle);
            }
            break;
        }
    }

    return group;
}

// ===== AVATAR (Pastelito D) =====
function createAvatar(){
    avatar=new THREE.Group();

    const matBase=new THREE.MeshStandardMaterial({color:0xf5a623,roughness:0.35});
    const matMid=new THREE.MeshStandardMaterial({color:0xffe8d0,roughness:0.3});
    const matTop=new THREE.MeshStandardMaterial({color:0xff9ab0,roughness:0.25});
    const matCherry=new THREE.MeshStandardMaterial({color:0xe74c3c,roughness:0.2,metalness:0.15});
    const matArm=new THREE.MeshStandardMaterial({color:0xffb0c0,roughness:0.35});
    const matDrip=new THREE.MeshStandardMaterial({color:0xf5a623,roughness:0.3,metalness:0.05});

    // Bottom layer - golden
    const base=new THREE.Mesh(new THREE.CylinderGeometry(0.65,0.7,0.45,32),matBase);
    base.position.y=0.225;base.castShadow=true;avatar.add(base);

    // Drip on bottom layer
    for(let i=0;i<6;i++){
        const drip=new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8),matDrip);
        const a=(i/6)*Math.PI*2;
        drip.scale.y=1.5;
        drip.position.set(Math.cos(a)*0.66,0.35,Math.sin(a)*0.66);
        avatar.add(drip);
    }

    // Middle layer - cream
    const mid=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.6,0.3,32),matMid);
    mid.position.y=0.65;mid.castShadow=true;avatar.add(mid);

    // Top layer - pink
    const top=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.5,0.25,32),matTop);
    top.position.y=0.925;top.castShadow=true;avatar.add(top);

    // Cherry on top
    cherryObj=new THREE.Mesh(new THREE.SphereGeometry(0.09,16,16),matCherry);
    cherryObj.position.y=1.15;cherryObj.castShadow=true;avatar.add(cherryObj);

    // Cherry stem
    const stemMat=new THREE.MeshStandardMaterial({color:0x2d5a1e,roughness:0.5});
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.12,6),stemMat);
    stem.position.y=1.26;stem.rotation.z=0.2;avatar.add(stem);

    // Cherry leaf
    const leafMat=new THREE.MeshStandardMaterial({color:0x3a8a2a,roughness:0.4});
    const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.03,8,8),leafMat);
    leaf.scale.set(0.4,1.2,0.8);
    leaf.position.set(0.04,1.28,0);leaf.rotation.z=-0.5;avatar.add(leaf);

    // Face
    faceGroup=new THREE.Group();
    faceGroup.position.set(0,0.55,0.6);

    // Eyes
    eyeL=createEye();eyeL.position.set(-0.16,0.08,0);faceGroup.add(eyeL);
    eyeR=createEye();eyeR.position.set(0.16,0.08,0);faceGroup.add(eyeR);
    pupilL=eyeL.getObjectByName('pupil');
    pupilR=eyeR.getObjectByName('pupil');

    // Eyebrows
    const browMat=new THREE.MeshStandardMaterial({color:0x5a3a2a,roughness:0.5});
    const browL=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.015,0.01),browMat);
    browL.position.set(-0.16,0.2,0.04);browL.rotation.z=0.15;faceGroup.add(browL);
    const browR=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.015,0.01),browMat);
    browR.position.set(0.16,0.2,0.04);browR.rotation.z=-0.15;faceGroup.add(browR);

    // Cheeks (blush)
    const blushMat=new THREE.MeshStandardMaterial({color:0xff8888,roughness:0.6,transparent:true,opacity:0.4});
    const cheekL=new THREE.Mesh(new THREE.CircleGeometry(0.04,16),blushMat);
    cheekL.position.set(-0.25,-0.02,0.04);faceGroup.add(cheekL);
    const cheekR=new THREE.Mesh(new THREE.CircleGeometry(0.04,16),blushMat);
    cheekR.position.set(0.25,-0.02,0.04);faceGroup.add(cheekR);

    // Nose
    const nose=new THREE.Mesh(new THREE.SphereGeometry(0.025,12,12),new THREE.MeshStandardMaterial({color:0xffb0c0,roughness:0.3}));
    nose.position.set(0,-0.02,0.06);nose.scale.set(1,0.8,0.7);faceGroup.add(nose);

    // Mouth
    mouthObj=new THREE.Mesh(new THREE.SphereGeometry(0.05,16,8,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0xe74c3c,roughness:0.3}));
    mouthObj.rotation.x=Math.PI;mouthObj.position.set(0,-0.1,0.01);
    faceGroup.add(mouthObj);

    avatar.add(faceGroup);

    // Arms
    const armGeo=new THREE.CapsuleGeometry(0.04,0.22,8,12);
    const armL=new THREE.Mesh(armGeo,matArm);armL.position.set(-0.75,0.55,0.15);armL.rotation.z=0.5;armL.name='armL';avatar.add(armL);
    const armR=new THREE.Mesh(armGeo,matArm);armR.position.set(0.75,0.55,0.15);armR.rotation.z=-0.5;armR.name='armR';avatar.add(armR);

    // Hands
    const handMat=new THREE.MeshStandardMaterial({color:0xffc0cb,roughness:0.35});
    const handL=new THREE.Mesh(new THREE.SphereGeometry(0.05,12,12),handMat);
    handL.position.set(-0.92,0.42,0.15);handL.name='handL';avatar.add(handL);
    const handR=new THREE.Mesh(new THREE.SphereGeometry(0.05,12,12),handMat);
    handR.position.set(0.92,0.42,0.15);handR.name='handR';avatar.add(handR);

    avatar.position.set(-2,0,2);
    avatar.name='avatar';
    scene.add(avatar);
}

// ===== ANIMATION =====
let breathPhase=0,blinkTimer=0,nextBlink=2+Math.random()*4,mouthPhase=0;

function animate(){
    requestAnimationFrame(animate);
    const dt=clock.getDelta();
    const t=clock.getElapsedTime();

    breathPhase+=dt*1.5;
    blinkTimer+=dt;

    if(avatar){
        // Breathing - subtle body rise/fall
        avatar.position.y=Math.sin(breathPhase)*0.015;
        avatar.rotation.z=Math.sin(breathPhase*0.7)*0.012;

        // Blink
        if(blinkTimer>nextBlink){
            blinkTimer=0;nextBlink=2+Math.random()*4;
            blink();
        }

        // Mouth when talking
        if(isTalking){
            mouthPhase+=dt*14;
            if(mouthObj){
                const s=0.6+Math.abs(Math.sin(mouthPhase))*0.6;
                mouthObj.scale.set(s,1+Math.sin(mouthPhase*1.3)*0.35,1);
            }
        }else{
            if(mouthObj)mouthObj.scale.set(1,1,1);
        }

        // Cherry bob
        if(cherryObj){
            cherryObj.position.y=1.15+Math.sin(t*1.5)*0.012;
        }

        // Arm idle swing
        const armL=avatar.getObjectByName('armL');
        const armR=avatar.getObjectByName('armR');
        const handL=avatar.getObjectByName('handL');
        const handR=avatar.getObjectByName('handR');
        if(armL){
            armL.rotation.z=0.5+Math.sin(t*0.8)*0.06;
            if(handL)handL.position.y=0.42+Math.sin(t*0.8)*0.02;
        }
        if(armR){
            armR.rotation.z=-0.5+Math.sin(t*0.8+1)*0.06;
            if(handR)handR.position.y=0.42+Math.sin(t*0.8+1)*0.02;
        }

        // Look at selected product
        if(selectedProduct&&faceGroup){
            const target=selectedProduct.position.clone();
            target.y=faceGroup.getWorldPosition(new THREE.Vector3()).y;
            const dir=target.clone().sub(faceGroup.getWorldPosition(new THREE.Vector3()));
            if(dir.length()>0.5){
                faceGroup.lookAt(target);
            }
        }else if(faceGroup){
            // Idle look forward
            faceGroup.rotation.y+=(0-faceGroup.rotation.y)*0.05;
        }
    }

    // Product hover/selected glow effect
    products.forEach(p=>{
        const targetY=p===selectedProduct?1.0:0.9;
        p.position.y+=(targetY-p.position.y)*0.08;

        // Rotation for selected product
        if(p===selectedProduct){
            p.rotation.y+=dt*0.5;
        }
    });

    controls.update();
    renderer.render(scene,camera);
}

function blink(){
    if(!eyeL||!eyeR)return;
    let frame=0;
    const anim=()=>{
        frame++;
        const s=frame<=4?1-frame/4:frame<=8?(frame-4)/4:1;
        eyeL.scale.y=Math.max(0.05,s);
        eyeR.scale.y=Math.max(0.05,s);
        if(frame<8)requestAnimationFrame(anim);
    };
    anim();
}

// ===== INTERACTION =====
function onMouseMove(e){
    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;

    raycaster.setFromCamera(mouse,camera);
    const intersects=raycaster.intersectObjects(products,true);

    document.body.style.cursor=intersects.length>0?'pointer':'default';
}

function onClick(e){
    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;

    raycaster.setFromCamera(mouse,camera);
    const intersects=raycaster.intersectObjects(products,true);

    if(intersects.length>0){
        let obj=intersects[0].object;
        while(obj.parent&&!obj.userData.id)obj=obj.parent;
        if(obj.userData.id)selectProduct(obj);
    }
}

function selectProduct(product){
    selectedProduct=product;
    const data=product.userData;

    // Update UI
    document.getElementById('infoName').textContent=data.name;
    document.getElementById('infoPrice').textContent=data.price;
    document.getElementById('infoDesc').textContent=data.desc;
    document.getElementById('infoPanel').classList.add('show');

    // Update cards
    document.querySelectorAll('.card').forEach((c,i)=>{
        c.classList.toggle('selected',i===data.index);
    });

    // Move to main display
    const mainCase=displayCases[0];
    if(mainCase){
        const targetPos=mainCase.position.clone();
        targetPos.y=1.0;
        animateProductTo(product,targetPos);
    }

    // Avatar looks at product and speaks
    speak(data.name+'. '+data.desc+'. Precio: '+data.price+' pesos colombianos.');
}

function animateProductTo(product,target){
    const start=product.position.clone();
    const duration=900;
    const st=Date.now();
    (function anim(){
        const t=Math.min((Date.now()-st)/duration,1);
        const ease=1-Math.pow(1-t,3);
        product.position.lerpVectors(start,target,ease);
        if(t<1)requestAnimationFrame(anim);
    })();
}

// ===== VOICE =====
async function speakEL(txt){
    document.getElementById('loading').classList.add('on');
    try{
        const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${EL_VOICE}`,{
            method:'POST',
            headers:{'Content-Type':'application/json','xi-api-key':EL_KEY},
            body:JSON.stringify({text:txt,model_id:EL_MODEL,voice_settings:{stability:0.5,similarity_boost:0.75}})
        });
        if(!r.ok)throw new Error(r.status);
        const blob=await r.blob();
        const url=URL.createObjectURL(blob);
        const audio=new Audio(url);
        document.getElementById('loading').classList.remove('on');
        audio.onplay=()=>{isTalking=true;showBubble(txt)};
        audio.onended=()=>{isTalking=false;hideBubble();URL.revokeObjectURL(url)};
        audio.onerror=()=>{document.getElementById('loading').classList.remove('on');speakFB(txt)};
        await audio.play();
    }catch(e){document.getElementById('loading').classList.remove('on');speakFB(txt)}
}

function speakFB(txt){
    if(!S){showBubble(txt);return}
    S.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='es-ES';u.rate=rate;u.pitch=1.05;u.volume=1;
    const vs=S.getVoices();
    const p=['Microsoft Sabina','Microsoft Helena','Google español','Paulina','es-ES'];
    let v=null;for(const n of p){v=vs.find(x=>x.name.includes(n));if(v)break}
    if(!v)v=vs.find(x=>x.lang.startsWith('es'));
    if(v)u.voice=v;
    u.onstart=()=>{isTalking=true;showBubble(txt)};
    u.onend=()=>{isTalking=false;hideBubble()};
    S.speak(u);
}

function speak(txt){if(!voiceOn){showBubble(txt);return}if(EL_KEY&&EL_VOICE){speakEL(txt);return}speakFB(txt)}

// ===== UI =====
function showBubble(t){document.getElementById('bubbleText').textContent=t;document.getElementById('bubble').classList.add('show')}
function hideBubble(){document.getElementById('bubble').classList.remove('show')}

function createProductCards(){
    const container=document.getElementById('productCards');
    const emojis={tarta:'🍰',cupcake:'🧁',macaron:'🍬',donut:'🍩'};
    productData.forEach((data,i)=>{
        const card=document.createElement('div');
        card.className='card';
        card.innerHTML=`<span class="em">${emojis[data.id]}</span><div class="inf"><div class="nm">${data.name}</div><div class="pr">${data.price}</div></div>`;
        card.onclick=()=>selectProduct(products[i]);
        container.appendChild(card);
    });
}

// ===== PROMO MODE =====
window.togglePromo=function(){
    promoMode=!promoMode;
    const btn=document.getElementById('promoBtn');
    btn.className=promoMode?'btn active':'btn';

    if(promoMode){
        promoIndex=0;
        showNextPromo();
    }else{
        clearTimeout(promoTimer);
        promoTimer=null;
    }
};

function showNextPromo(){
    if(!promoMode)return;
    const data=productData[promoIndex];
    selectProduct(products[promoIndex]);
    speak(data.name+'. '+data.price+' pesos colombianos.');
    promoIndex=(promoIndex+1)%productData.length;
    promoTimer=setTimeout(showNextPromo,10000);
}

// ===== CONTROLS =====
window.toggleVoice=function(){
    voiceOn=!voiceOn;
    const b=document.getElementById('voiceBtn');
    b.className=voiceOn?'on':'';
    b.textContent=voiceOn?'🔊 Voz':'🔇 Mute';
    if(!voiceOn){S&&S.cancel();isTalking=false;hideBubble()}
};

window.resetCamera=function(){
    controls.target.set(0,1.5,0);
    camera.position.set(0,4,10);
};

window.resetView=function(){
    selectedProduct=null;
    document.getElementById('infoPanel').classList.remove('show');
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
    products.forEach((p,i)=>{
        const caseIndex=i+1;
        if(displayCases[caseIndex]){
            const pos=displayCases[caseIndex].position;
            animateProductTo(p,new THREE.Vector3(pos.x,0.9,pos.z));
        }
    });
    if(faceGroup)faceGroup.rotation.y=0;
};

window.greet=function(){speak('¡Hola! Bienvenido a nuestra tienda de postres. Selecciona un producto del menú.')};

// ===== START =====
document.getElementById('startBtn').onclick=()=>{
    document.getElementById('splash').classList.add('hide');
    setTimeout(()=>{
        document.getElementById('splash').remove();
        speak('¡Bienvenido a Chef Byte! Esta es nuestra tienda de postres 3D. Selecciona cualquier postre de la vitrina para conocerlo.');
    },700);
};

initThree();
createEnvironment();
createProducts();
createAvatar();
createProductCards();

renderer.domElement.addEventListener('mousemove',onMouseMove);
renderer.domElement.addEventListener('click',onClick);

animate();

window.addEventListener('resize',()=>{
