<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef Byte</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍰</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0d1b2a 100%);min-height:100vh;overflow:hidden;color:#fff}

/* ===== AVATAR ===== */
.avatar{position:fixed;width:200px;height:280px;z-index:100;cursor:grab;user-select:none}
.avatar:active{cursor:grabbing}

.avatar.idle{animation:avIdle 4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes avIdle{0%,100%{transform:translateY(0) rotate(0) scale(1)}25%{transform:translateY(-12px) rotate(1.5deg) scale(1.01)}50%{transform:translateY(-5px) rotate(0) scale(1)}75%{transform:translateY(-8px) rotate(-1.5deg) scale(1.01)}}

.avatar.talking{animation:avTalk .3s ease-in-out infinite}
@keyframes avTalk{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.02)}}

.avatar.walking{animation:avWalk .6s ease-in-out infinite}
@keyframes avWalk{0%,100%{transform:translateY(0) rotate(-2deg)}25%{transform:translateY(-20px) rotate(3deg)}50%{transform:translateY(-4px) rotate(-1deg)}75%{transform:translateY(-24px) rotate(2deg)}}

/* Pastel body */
.body{position:relative;width:180px;height:200px;margin:40px auto 0}

.cake-base{position:absolute;width:170px;height:90px;background:linear-gradient(180deg,#f5a623 0%,#e8941a 50%,#d4840f 100%);border-radius:20px;bottom:0;left:50%;transform:translateX(-50%);box-shadow:0 12px 35px rgba(0,0,0,.5),inset 0 -8px 15px rgba(0,0,0,.2),inset 0 2px 5px rgba(255,255,255,.1)}

.cake-mid{position:absolute;width:155px;height:55px;background:linear-gradient(180deg,#fff5e6 0%,#ffd4a4 100%);border-radius:16px;bottom:85px;left:50%;transform:translateX(-50%);box-shadow:0 8px 20px rgba(0,0,0,.3),inset 0 5px 12px rgba(255,255,255,.7)}

.cake-top{position:absolute;width:135px;height:48px;background:linear-gradient(180deg,#ffb6c1 0%,#ff7088 100%);border-radius:15px;bottom:132px;left:50%;transform:translateX(-50%);box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 4px 10px rgba(255,255,255,.5)}

/* ===== GLAZIADO ANIMADO ===== */
.drip{position:absolute;width:16px;border-radius:0 0 9px 9px;bottom:128px;animation:dripPulse 3s ease-in-out infinite}
.d1{left:40px;height:26px;background:linear-gradient(180deg,#fff 0%,#ffe8e8 100%);animation-delay:0s}
.d2{left:62px;height:35px;background:linear-gradient(180deg,#fff5f5 0%,#ffd4d4 100%);animation-delay:.4s}
.d3{right:62px;height:22px;background:linear-gradient(180deg,#fff 0%,#ffe0e0 100%);animation-delay:.8s}
.d4{right:40px;height:30px;background:linear-gradient(180deg,#fff8f8 0%,#ffcccc 100%);animation-delay:1.2s}
@keyframes dripPulse{0%,100%{height:var(--h);opacity:.9;transform:scaleY(1)}50%{height:calc(var(--h) + 6px);opacity:1;transform:scaleY(1.08)}}
.d1{--h:26px}.d2{--h:35px}.d3{--h:22px}.d4{--h:30px}

/* Glaziado extra animado */
.glaze{position:absolute;width:145px;height:12px;background:linear-gradient(90deg,rgba(255,255,255,.3),rgba(255,255,255,.8),rgba(255,255,255,.3));border-radius:50%;bottom:142px;left:50%;transform:translateX(-50%);animation:glazeShine 4s ease-in-out infinite;z-index:3}
@keyframes glazeShine{0%,100%{opacity:.4;transform:translateX(-50%) scaleX(.9)}50%{opacity:.8;transform:translateX(-50%) scaleX(1.1)}}

/* Brillo del glaziado */
.glaze-glint{position:absolute;width:30px;height:6px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);border-radius:3px;bottom:148px;z-index:4;animation:glintMove 3s ease-in-out infinite}
@keyframes glintMove{0%{left:20%;opacity:0}50%{opacity:1}100%{left:70%;opacity:0}}

/* Cereza */
.cherry{position:absolute;width:24px;height:24px;background:radial-gradient(circle at 35% 35%,#ff6b6b 0%,#c0392b 100%);border-radius:50%;top:0;left:50%;transform:translateX(-50%);box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 20px rgba(255,107,107,.3);animation:cherryGlow 3s ease-in-out infinite, cherryBounce 2s ease-in-out infinite}
@keyframes cherryGlow{0%,100%{box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 20px rgba(255,107,107,.3)}50%{box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 35px rgba(255,107,107,.6)}}
@keyframes cherryBounce{0%,100%{transform:translateX(-50%) translateY(0) rotate(0)}50%{transform:translateX(-50%) translateY(-3px) rotate(5deg)}}
.cherry::before{content:'';position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:3px;height:14px;background:linear-gradient(180deg,#2d5016,#4a7c23);border-radius:2px;animation:stemSway 2s ease-in-out infinite}
@keyframes stemSway{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(8deg)}}

/* ===== BRAZOS MEJORADOS ===== */
.arm{position:absolute;width:45px;height:18px;border-radius:9px;bottom:80px;z-index:12;transition:all .4s cubic-bezier(.4,0,.2,1)}

.arm-left{left:-32px;transform-origin:right center;background:linear-gradient(90deg,#ff91a4 0%,#ffb6c1 50%,#ffd4dc 100%);transform:rotate(15deg);border-radius:9px 14px 14px 9px}

.arm-right{right:-32px;transform-origin:left center;background:linear-gradient(90deg,#ffd4dc 0%,#ffb6c1 50%,#ff91a4 100%);transform:rotate(-15deg);border-radius:14px 9px 9px 14px}

/* Manos redondeadas */
.hand{position:absolute;width:22px;height:22px;background:radial-gradient(circle at 40% 40%,#ffd4dc,#ffb6c1);border-radius:50%;top:-2px}
.arm-left .hand{left:-8px}
.arm-right .hand{right:-8px}

/* Animaciones de brazos */
.arm.wave{animation:armWave .5s ease-in-out infinite}
@keyframes armWave{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-40deg)}}

.arm.point{animation:armPoint .8s cubic-bezier(.4,0,.2,1) forwards}
@keyframes armPoint{0%{transform:rotate(-15deg)}100%{transform:rotate(-70deg) translateX(15px)}}

.arm.gesture{animation:armGesture 2s ease-in-out infinite}
@keyframes armGesture{0%,100%{transform:rotate(15deg) translateY(0)}25%{transform:rotate(5deg) translateY(-5px)}50%{transform:rotate(20deg) translateY(0)}75%{transform:rotate(10deg) translateY(-3px)}}

/* ===== CARA ===== */
.face{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:110px;height:75px;z-index:15}

/* Ojos */
.eye{position:absolute;width:28px;height:32px;background:radial-gradient(circle at 30% 30%,#fff 0%,#f8f8f8 40%,#e8e8e8 70%,#ddd 100%);border-radius:50%;top:8px;box-shadow:inset 0 2px 6px rgba(0,0,0,.08),0 3px 6px rgba(0,0,0,.15);overflow:hidden;transition:transform .15s cubic-bezier(.4,0,.2,1)}
.eye-left{left:10px}.eye-right{right:10px}

.pupil{position:absolute;width:13px;height:17px;background:radial-gradient(circle at 35% 35%,#5a5a5a 0%,#2a2a2a 50%,#1a1a1a 100%);border-radius:50%;top:8px;left:7px;transition:transform .1s cubic-bezier(.4,0,.2,1)}
.pupil::after{content:'';position:absolute;top:2px;left:2px;width:5px;height:5px;background:rgba(255,255,255,.9);border-radius:50%}
.pupil::before{content:'';position:absolute;top:7px;left:8px;width:3px;height:3px;background:rgba(255,255,255,.5);border-radius:50%}

.eye.happy{transform:scaleY(.25) translateY(7px)}
.eye.surprised{transform:scale(1.35)}
.eye.blink{animation:eyeBlink .15s ease-in-out}
@keyframes eyeBlink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.05)}}

/* Cejas */
.brow{position:absolute;width:18px;height:4px;background:#8b6f5c;border-radius:2px;top:2px;transition:transform .2s ease}
.brow-left{left:12px;transform:rotate(-8deg)}.brow-right{right:12px;transform:rotate(8deg)}
.brow.raised{transform:translateY(-3px) rotate(0)}

/* Mejillas */
.cheek{position:absolute;width:20px;height:14px;background:radial-gradient(ellipse,rgba(255,150,150,.5) 0%,transparent 70%);border-radius:50%;top:26px;opacity:0;transition:opacity .3s ease}
.cheek-left{left:-5px}.cheek-right{right:-5px}
.cheek.visible{opacity:1}

/* Boca mejorada */
.mouth{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:44px;height:18px;background:linear-gradient(180deg,#c0392b 0%,#e74c3c 50%,#ff6b6b 100%);border-radius:0 0 22px 22px;box-shadow:inset 0 -4px 6px rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.1);transition:all .08s ease-out;overflow:hidden}

/* Dientes superiores */
.mouth::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:5px;background:#fff;border-radius:0 0 4px 4px}

/* Estados de boca para hablar */
.mouth.m1{height:6px;width:30px;border-radius:0 0 15px 15px}
.mouth.m2{height:22px;width:38px;border-radius:0 0 19px 19px}
.mouth.m3{height:12px;width:44px;border-radius:0 0 22px 22px}
.mouth.m4{height:28px;width:26px;border-radius:0 0 13px 13px}
.mouth.m5{height:8px;width:40px;border-radius:0 0 20px 20px}
.mouth.m6{height:32px;width:22px;border-radius:0 0 11px 11px}

.mouth.smile{height:26px;border-radius:16px 16px 22px 22px;background:linear-gradient(180deg,#ff6b6b 0%,#ff91a4 100%)}
.mouth.surprised{width:24px;height:24px;border-radius:50%}

/* ===== EFECTOS ===== */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200}
.particle{position:absolute;font-size:1.1rem;animation:particleFly 1.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.3) rotate(360deg)}}

.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 2.5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(1)}50%{opacity:.7;transform:scale(1.3)}}

/* Burbuja */
.speech-bubble{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(15,15,35,.95);border:1px solid rgba(255,107,107,.4);border-radius:18px;padding:16px 26px;max-width:520px;min-width:280px;box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px rgba(255,107,107,.08);z-index:150;text-align:center;opacity:0;transition:all .4s cubic-bezier(.4,0,.2,1);pointer-events:none}
.speech-bubble.visible{opacity:1;transform:translateX(-50%) translateY(0)}
.speech-bubble::after{content:'';position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);border-width:13px;border-style:solid;border-color:rgba(15,15,35,.95) transparent transparent}
.speech-text{font-size:.92rem;color:#eee;line-height:1.6}

/* Humo para productos */
.smoke-wrap{position:fixed;z-index:250;pointer-events:none;opacity:0;transition:all .5s cubic-bezier(.68,-.55,.27,1.55)}
.smoke-wrap.visible{opacity:1}
.smoke-card{background:rgba(12,12,30,.96);border:1px solid rgba(255,107,107,.25);border-radius:18px;padding:22px;box-shadow:0 12px 45px rgba(0,0,0,.6),0 0 40px rgba(255,107,107,.08)}
.smoke-emoji{font-size:3.2rem;margin-bottom:8px}
.smoke-name{font-size:1.15rem;font-weight:700;color:#ff6b6b}
.smoke-desc{font-size:.85rem;color:#bbb;margin-top:6px;line-height:1.5}
.smoke-price{font-size:1.1rem;color:#00b894;margin-top:10px;font-weight:700}

/* ===== CONTROLES ===== */
.ctrl-panel{position:fixed;top:14px;left:14px;z-index:200;display:flex;flex-direction:column;gap:6px}

.btn{padding:10px 18px;border:1px solid rgba(255,255,255,.08);border-radius:12px;font-size:.82rem;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);font-weight:600;background:rgba(255,255,255,.06);color:#ddd;backdrop-filter:blur(12px);letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,107,107,.4);transform:translateX(5px);color:#fff}
.btn:active{transform:scale(.97) translateX(5px)}
.btn-accent{background:linear-gradient(135deg,#ff6b6b,#ee5a24);border-color:transparent;color:#fff}
.btn-accent:hover{background:linear-gradient(135deg,#ff7575,#f06535);box-shadow:0 4px 25px rgba(255,107,107,.35)}

/* Productos - derecha */
.products-panel{position:fixed;top:50%;right:14px;transform:translateY(-50%);z-index:200;display:flex;flex-direction:column;gap:8px}
.product-card{background:rgba(12,12,30,.9);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(12px);display:flex;align-items:center;gap:12px;min-width:170px}
.product-card:hover{border-color:rgba(255,107,107,.5);transform:translateX(-8px) scale(1.02);box-shadow:0 6px 25px rgba(255,107,107,.15)}
.product-card .emoji{font-size:1.6rem;transition:transform .3s ease}
.product-card:hover .emoji{transform:scale(1.2) rotate(-5deg)}
.product-card .info{text-align:left}
.product-card .name{font-size:.84rem;font-weight:600;color:#fff}
.product-card .price{font-size:.76rem;color:#00b894;margin-top:3px}

/* Barra inferior */
.voice-bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:200}
.v-btn{padding:9px 18px;border:1px solid rgba(255,255,255,.1);border-radius:12px;font-size:.82rem;cursor:pointer;font-weight:600;transition:all .25s cubic-bezier(.4,0,.2,1);background:rgba(255,255,255,.06);color:#ddd;backdrop-filter:blur(12px)}
.v-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.v-btn.active{background:linear-gradient(135deg,#00b894,#00cec9);border-color:transparent;color:#fff}

/* Brand */
.brand{position:fixed;top:14px;right:14px;z-index:200;text-align:right}
.brand-name{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#ff6b6b 0%,#f5a623 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1.5px}
.brand-tag{font-size:.68rem;color:#666;letter-spacing:3px;text-transform:uppercase;margin-top:3px}

/* Modal */
.recipe-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:400;max-width:440px;width:92%;max-height:82vh;overflow-y:auto;background:rgba(12,12,30,.98);border:1px solid rgba(255,107,107,.25);border-radius:20px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 50px rgba(255,107,107,.08);transition:transform .4s cubic-bezier(.68,-.55,.27,1.55);opacity:0}
.recipe-modal.open{transform:translate(-50%,-50%) scale(1);opacity:1}
.recipe-modal h2{font-size:1.25rem;color:#ff6b6b;margin-bottom:14px}
.recipe-modal h3{color:#00b894;margin:14px 0 8px;font-size:.88rem;letter-spacing:.5px}
.recipe-modal ul,.recipe-modal ol{padding-left:20px}
.recipe-modal li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.86rem;color:#bbb;line-height:1.5}
.recipe-close{position:absolute;top:14px;right:18px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#666;transition:all .2s}
.recipe-close:hover{color:#ff6b6b;transform:rotate(90deg)}

/* Splash */
.splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0a0a1a,#1a1a3e,#0d1b2a);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .5s ease}
.splash.hide{opacity:0;pointer-events:none}
.splash-cake{font-size:5.5rem;animation:floatCake 3s ease-in-out infinite}
@keyframes floatCake{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-20px) rotate(3deg)}}
.splash-title{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,#ff6b6b,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:20px 0 8px;letter-spacing:2px}
.splash-sub{color:#666;font-size:.85rem;letter-spacing:4px;text-transform:uppercase;margin-bottom:35px}
.splash-btn{padding:16px 50px;background:linear-gradient(135deg,#ff6b6b,#ee5a24);border:none;border-radius:30px;color:#fff;font-weight:700;font-size:1rem;cursor:pointer;transition:all .3s;box-shadow:0 6px 25px rgba(255,107,107,.3);letter-spacing:1px}
.splash-btn:hover{transform:scale(1.05);box-shadow:0 8px 35px rgba(255,107,107,.5)}

@media(max-width:700px){
.avatar{width:150px;height:220px}
.body{width:140px;height:160px}
.cake-base{width:130px;height:70px}
.cake-mid{width:118px;height:42px;bottom:65px}
.cake-top{width:105px;height:38px;bottom:102px}
.face{top:14px;width:85px;height:60px}
.eye{width:22px;height:26px}.pupil{width:10px;height:13px}
.mouth{width:34px;height:14px}
.arm{width:35px;height:14px}
.hand{width:18px;height:18px}
.ctrl-panel{top:auto;bottom:70px;left:8px}
.products-panel{top:auto;bottom:120px;right:8px}
.brand{top:8px;right:8px}
.brand-name{font-size:1.2rem}
}
</style>
</head>
<body>

<!-- Splash -->
<div class="splash" id="splash">
    <div class="splash-cake">🍰</div>
    <div class="splash-title">CHEF BYTE</div>
    <div class="splash-sub">Asistente Gastronómico</div>
    <button class="splash-btn" id="startBtn">INICIAR</button>
</div>

<div class="stars" id="stars"></div>
<div class="particles" id="particles"></div>

<div class="brand">
    <div class="brand-name">CHEF BYTE</div>
    <div class="brand-tag">Cocina Digital</div>
</div>

<!-- Avatar -->
<div class="avatar idle" id="avatar">
    <div class="body">
        <div class="cherry"></div>
        <div class="cake-top"></div>
        <div class="glaze"></div>
        <div class="glaze-glint"></div>
        <div class="drip d1"></div><div class="drip d2"></div><div class="drip d3"></div><div class="drip d4"></div>
        <div class="cake-mid"></div>
        <div class="cake-base">
            <div class="arm arm-left" id="armL"><div class="hand"></div></div>
            <div class="arm arm-right" id="armR"><div class="hand"></div></div>
            <div class="face">
                <div class="brow brow-left" id="browL"></div>
                <div class="brow brow-right" id="browR"></div>
                <div class="eye eye-left" id="eyeL"><div class="pupil" id="pupilL"></div></div>
                <div class="eye eye-right" id="eyeR"><div class="pupil" id="pupilR"></div></div>
                <div class="cheek cheek-left" id="cheekL"></div>
                <div class="cheek cheek-right" id="cheekR"></div>
                <div class="mouth" id="mouth"></div>
            </div>
        </div>
    </div>
</div>

<!-- Humo -->
<div class="smoke-wrap" id="smokeWrap">
    <div class="smoke-card">
        <div class="smoke-emoji" id="smokeEmoji"></div>
        <div class="smoke-name" id="smokeName"></div>
        <div class="smoke-desc" id="smokeDesc"></div>
        <div class="smoke-price" id="smokePrice"></div>
    </div>
</div>

<!-- Burbuja -->
<div class="speech-bubble" id="speechBubble"><p class="speech-text" id="speechText"></p></div>

<!-- Productos -->
<div class="products-panel">
    <div class="product-card" onclick="showProduct('cake')">
        <span class="emoji">🍰</span>
        <div class="info"><div class="name">Pastel Chocolate</div><div class="price">$35.000</div></div>
    </div>
    <div class="product-card" onclick="showProduct('pasta')">
        <span class="emoji">🍝</span>
        <div class="info"><div class="name">Pasta Italiana</div><div class="price">$42.000</div></div>
    </div>
    <div class="product-card" onclick="showProduct('tacos')">
        <span class="emoji">🌮</span>
        <div class="info"><div class="name">Tacos Gourmet</div><div class="price">$28.000</div></div>
    </div>
    <div class="product-card" onclick="showProduct('sushi')">
        <span class="emoji">🍣</span>
        <div class="info"><div class="name">Sushi Premium</div><div class="price">$65.000</div></div>
    </div>
</div>

<!-- Info -->
<div class="ctrl-panel">
    <button class="btn" onclick="showMenu()">📋 Menú</button>
    <button class="btn" onclick="showPrices()">💰 Precios</button>
    <button class="btn" onclick="greet()">👋 Saludar</button>
</div>

<!-- Barra inferior -->
<div class="voice-bar">
    <button class="v-btn active" id="voiceBtn" onclick="toggleVoice()">🔊 Voz</button>
    <button class="v-btn" id="speedBtn" onclick="changeSpeed()">⚡ Normal</button>
</div>

<!-- Modal -->
<div class="recipe-modal" id="recipeModal">
    <button class="recipe-close" onclick="closeRecipe()">✕</button>
    <h2 id="rTitle"></h2>
    <h3>Ingredientes:</h3><ul id="rIng"></ul>
    <h3>Preparación:</h3><ol id="rSteps"></ol>
</div>

<script>
let voiceOn=true, rate=0.85, dragging=false, dragOff={x:0,y:0};
let cx=innerWidth/2-100, cy=innerHeight/3-40;
const S=window.speechSynthesis, A=document.getElementById('avatar');
let talkInterval=null, blinkTimer=null;

// ===== INIT =====
function init(){
    A.style.left=cx+'px'; A.style.top=cy+'px';
    mkStars(); setupDrag(); trackMouse();
    startBlinking();
    
    document.getElementById('startBtn').addEventListener('click',()=>{
        document.getElementById('splash').classList.add('hide');
        setTimeout(()=>{
            document.getElementById('splash').remove();
            speak('Bienvenido a Chef Byte. Soy tu asistente gastronómico. Selecciona un platillo del menú para conocer nuestra propuesta.');
            document.getElementById('armL').classList.add('wave');
            setTimeout(()=>document.getElementById('armL').classList.remove('wave'),2000);
        },500);
    });
}

// ===== VOZ NATURAL =====
function speak(txt){
    if(!voiceOn||!S){showBubble(txt);return}
    S.cancel();
    
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='es-CO';
    u.rate=rate;
    u.pitch=1.0;
    u.volume=1;
    
    // Buscar voz colombiana o latina
    const vs=S.getVoices();
    let v=vs.find(x=>x.lang==='es-CO');
    if(!v)v=vs.find(x=>x.lang==='es-MX');
    if(!v)v=vs.find(x=>x.lang==='es-ES');
    if(!v)v=vs.find(x=>x.lang.startsWith('es'));
    if(v)u.voice=v;
    
    u.onstart=()=>{startMouth();A.classList.remove('idle');A.classList.add('talking');showBubble(txt)};
    u.onend=()=>{stopMouth();A.classList.remove('talking');A.classList.add('idle');setExpr('happy');setTimeout(()=>setExpr(''),2000)};
    u.onerror=()=>{stopMouth();showBubble(txt)};
    
    S.speak(u);
}

// ===== BOCA SINCRONIZADA =====
function startMouth(){
    stopMouth();
    const m=document.getElementById('mouth');
    const states=['m1','m2','m3','m4','m5','m6'];
    let i=0;
    talkInterval=setInterval(()=>{
        m.className='mouth';
        m.classList.add(states[i%states.length]);
        i++;
    },70+Math.random()*30);
}

function stopMouth(){
    if(talkInterval){clearInterval(talkInterval);talkInterval=null}
    document.getElementById('mouth').className='mouth';
}

// ===== PARPADEO =====
function startBlinking(){
    function blink(){
        const el=document.getElementById('eyeL'),er=document.getElementById('eyeR');
        el.classList.add('blink');er.classList.add('blink');
        setTimeout(()=>{el.classList.remove('blink');er.classList.remove('blink')},150);
        blinkTimer=setTimeout(blink,2500+Math.random()*3000);
    }
    blinkTimer=setTimeout(blink,1500);
}

// ===== EXPRESIONES =====
function setExpr(t){
    const el=document.getElementById('eyeL'),er=document.getElementById('eyeR');
    const m=document.getElementById('mouth');
    const cl=document.getElementById('cheekL'),cr=document.getElementById('cheekR');
    const bl=document.getElementById('browL'),br=document.getElementById('browR');
    
    el.className='eye eye-left';er.className='eye eye-right';m.className='mouth';
    cl.classList.remove('visible');cr.classList.remove('visible');
    bl.classList.remove('raised');br.classList.remove('raised');
    
    switch(t){
        case'happy':el.classList.add('happy');er.classList.add('happy');m.classList.add('smile');cl.classList.add('visible');cr.classList.add('visible');break;
        case'surprised':el.classList.add('surprised');er.classList.add('surprised');m.classList.add('surprised');bl.classList.add('raised');br.classList.add('raised');break;
    }
}

function showBubble(t){document.getElementById('speechText').textContent=t;document.getElementById('speechBubble').classList.add('visible')}
function hideBubble(){document.getElementById('speechBubble').classList.remove('visible')}

function toggleVoice(){
    voiceOn=!voiceOn;
    const b=document.getElementById('voiceBtn');
    b.className=voiceOn?'v-btn active':'v-btn';
    b.textContent=voiceOn?'🔊 Voz':'🔇 Mute';
    if(!voiceOn){S.cancel();stopMouth();setExpr('');hideBubble()}
}

function changeSpeed(){
    const sp=[.7,.85,1,1.15,1.3];
    const lb=['Lenta','Normal','Media','Rápida','Muy rápida'];
    const i=sp.indexOf(rate);
    rate=sp[(i+1)%sp.length];
    document.getElementById('speedBtn').textContent='⚡ '+lb[(i+1)%sp.length];
}

// ===== UTILS =====
function mkStars(){const c=document.getElementById('stars');for(let i=0;i<45;i++){const s=document.createElement('div');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2.5}s;animation-duration:${2+Math.random()*2}s`;c.appendChild(s)}}

function setupDrag(){
    A.addEventListener('mousedown',dStart);A.addEventListener('touchstart',dStart,{passive:false});
    document.addEventListener('mousemove',dMove);document.addEventListener('touchmove',dMove,{passive:false});
    document.addEventListener('mouseup',dEnd);document.addEventListener('touchend',dEnd);
}
function dStart(e){e.preventDefault();dragging=true;A.classList.remove('idle');A.style.cursor='grabbing';const p=e.touches?e.touches[0]:e;dragOff.x=p.clientX-A.offsetLeft;dragOff.y=p.clientY-A.offsetTop}
function dMove(e){if(!dragging)return;e.preventDefault();const p=e.touches?e.touches[0]:e;cx=p.clientX-dragOff.x;cy=p.clientY-dragOff.y;A.style.left=cx+'px';A.style.top=cy+'px'}
function dEnd(){if(!dragging)return;dragging=false;A.style.cursor='grab';A.classList.add('idle');spawnP(4)}

function trackMouse(){
    document.addEventListener('mousemove',e=>{
        if(dragging)return;
        const r=A.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/90,dy=(e.clientY-r.top-r.height/2)/90;
        const pl=document.getElementById('pupilL'),pr=document.getElementById('pupilR');
        if(pl)pl.style.transform=`translate(${dx}px,${dy}px)`;
        if(pr)pr.style.transform=`translate(${dx}px,${dy}px)`;
    });
}

function walkTo(tx,ty,cb){
    A.classList.remove('idle','talking');
    A.classList.add('walking');
    document.getElementById('armL').classList.add('gesture');
    document.getElementById('armR').classList.add('gesture');
    
    const sx=cx,sy=cy,d=Math.sqrt((tx-sx)**2+(ty-sy)**2);
    const dur=Math.min(d*2,2200),st=Date.now();
    
    (function anim(){
        const t=Math.min((Date.now()-st)/dur,1);
        const ease=1-Math.pow(1-t,4);
        cx=sx+(tx-sx)*ease; cy=sy+(ty-sy)*ease;
        A.style.left=cx+'px'; A.style.top=cy+'px';
        A.style.transform=tx>sx?'scaleX(1)':'scaleX(-1)';
        
        if(t<1){requestAnimationFrame(anim)}
        else{
            A.classList.remove('walking');
            document.getElementById('armL').classList.remove('gesture');
            document.getElementById('armR').classList.remove('gesture');
            A.style.transform='';
            A.classList.add('idle');
            if(cb)cb();
        }
    })();
}

function spawnP(n){
    const c=document.getElementById('particles'),emj=['✨','⭐','💫','🌟','🍰','🧁'];
    for(let i=0;i<n;i++){
        const p=document.createElement('div');p.className='particle';
        p.textContent=emj[~~(Math.random()*emj.length)];
        const r=A.getBoundingClientRect();
        p.style.left=(r.left+r.width/2)+'px';p.style.top=(r.top+r.height/2)+'px';
        p.style.setProperty('--tx',(Math.random()-.5)*220+'px');
        p.style.setProperty('--ty',(Math.random()-.5)*220-60+'px');
        c.appendChild(p);setTimeout(()=>p.remove(),1200);
    }
}
