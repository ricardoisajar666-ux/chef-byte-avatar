for(let i=0;i<5;i++){const dr=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,8),dm);const a=(i/5)*Math.PI*2;dr.scale.y=1.5;dr.position.set(Math.cos(a)*0.61,0.3,Math.sin(a)*0.61);avatar.add(dr);}
avatar.add(new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.55,0.28,32),mM).translateY(0.59));
const tp=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.45,0.22,32),mT);tp.position.y=0.85;tp.castShadow=true;avatar.add(tp);
cherryObj=new THREE.Mesh(new THREE.SphereGeometry(0.08,16,16),mC);cherryObj.position.y=1.02;cherryObj.castShadow=true;avatar.add(cherryObj);
const st=new THREE.Mesh(new THREE.CylinderGeometry(0.007,0.007,0.1,6),new THREE.MeshStandardMaterial({color:0x2d5a1e,roughness:0.5}));st.position.y=1.12;st.rotation.z=0.2;avatar.add(st);
const cl=new THREE.Mesh(new THREE.SphereGeometry(0.025,8,8),new THREE.MeshStandardMaterial({color:0x3a8a2a,roughness:0.4}));cl.scale.set(0.4,1.2,0.8);cl.position.set(0.035,1.14,0);cl.rotation.z=-0.5;avatar.add(cl);
faceGroup=new THREE.Group();faceGroup.position.set(0,0.5,0.55);
eyeL=mkEye();eyeL.position.set(-0.14,0.07,0);faceGroup.add(eyeL);
eyeR=mkEye();eyeR.position.set(0.14,0.07,0);faceGroup.add(eyeR);
const brM=new THREE.MeshStandardMaterial({color:0x5a3a2a,roughness:0.5});
const bL=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.012,0.008),brM);bL.position.set(-0.14,0.17,0.035);bL.rotation.z=0.15;faceGroup.add(bL);
const bR=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.012,0.008),brM);bR.position.set(0.14,0.17,0.035);bR.rotation.z=-0.15;faceGroup.add(bR);
const blM=new THREE.MeshStandardMaterial({color:0xff8888,roughness:0.6,transparent:true,opacity:0.35});
faceGroup.add(new THREE.Mesh(new THREE.CircleGeometry(0.035,16),blM).translateX(-0.22).translateY(-0.02).translateZ(0.035));
faceGroup.add(new THREE.Mesh(new THREE.CircleGeometry(0.035,16),blM).translateX(0.22).translateY(-0.02).translateZ(0.035));
const ns=new THREE.Mesh(new THREE.SphereGeometry(0.02,12,12),new THREE.MeshStandardMaterial({color:0xffb0c0,roughness:0.3}));ns.position.set(0,-0.015,0.05);ns.scale.set(1,0.8,0.7);faceGroup.add(ns);
mouthObj=new THREE.Mesh(new THREE.SphereGeometry(0.04,16,8,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0xe74c3c,roughness:0.3}));mouthObj.rotation.x=Math.PI;mouthObj.position.set(0,-0.09,0.01);faceGroup.add(mouthObj);
avatar.add(faceGroup);
const ag=new THREE.CapsuleGeometry(0.035,0.2,8,12);
const aL=new THREE.Mesh(ag,mA);aL.position.set(-0.7,0.5,0.1);aL.rotation.z=0.6;aL.name='armL';avatar.add(aL);
const aR=new THREE.Mesh(ag,mA);aR.position.set(0.7,0.5,0.1);aR.rotation.z=-0.6;aR.name='armR';avatar.add(aR);
const hM=new THREE.MeshStandardMaterial({color:0xffc0cb,roughness:0.35});
const hL=new THREE.Mesh(new THREE.SphereGeometry(0.04,12,12),hM);hL.position.set(-0.88,0.38,0.1);hL.name='handL';avatar.add(hL);
const hR=new THREE.Mesh(new THREE.SphereGeometry(0.04,12,12),hM);hR.position.set(0.88,0.38,0.1);hR.name='handR';avatar.add(hR);
avatar.position.set(0,0,-0.8);scene.add(avatar);
}
function mkEye(){
const g=new THREE.Group();
g.add(new THREE.Mesh(new THREE.SphereGeometry(0.06,16,16),new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.08})).scale.set(1,1.15,0.6));
g.add(new THREE.Mesh(new THREE.CircleGeometry(0.032,16),new THREE.MeshStandardMaterial({color:0x4a3a2a,roughness:0.12})).translateZ(0.04));
g.add(new THREE.Mesh(new THREE.CircleGeometry(0.016,16),new THREE.MeshStandardMaterial({color:0x111111})).translateZ(0.044));
g.add(new THREE.Mesh(new THREE.CircleGeometry(0.007,8),new THREE.MeshBasicMaterial({color:0xffffff})).translateX(-0.008).translateY(0.01).translateZ(0.048));
g.add(new THREE.Mesh(new THREE.CircleGeometry(0.004,8),new THREE.MeshBasicMaterial({color:0xffffff})).translateX(0.006).translateY(-0.004).translateZ(0.048));
return g;
}
let breathPhase=0,blinkTimer=0,nextBlink=2+Math.random()*4,mouthPhase=0;
function animate(){
requestAnimationFrame(animate);
const dt=clock.getDelta(),t=clock.getElapsedTime();
breathPhase+=dt*1.5;blinkTimer+=dt;
if(avatar){
avatar.position.y=-0.5+Math.sin(breathPhase)*0.012;
avatar.rotation.z=Math.sin(breathPhase*0.7)*0.01;
if(blinkTimer>nextBlink){blinkTimer=0;nextBlink=2+Math.random()*4;blink();}
if(isTalking){mouthPhase+=dt*14;if(mouthObj){const s=0.5+Math.abs(Math.sin(mouthPhase))*0.7;mouthObj.scale.set(s,1+Math.sin(mouthPhase*1.3)*0.3,1);}}
else{if(mouthObj)mouthObj.scale.set(1,1,1);}
if(cherryObj)cherryObj.position.y=1.02+Math.sin(t*1.5)*0.01;
const aL=avatar.getObjectByName('armL'),aR=avatar.getObjectByName('armR');
if(aL)aL.rotation.z=0.6+Math.sin(t*0.8)*0.05;
if(aR)aR.rotation.z=-0.6+Math.sin(t*0.8+1)*0.05;
if(selectedProduct&&faceGroup){const tp=selectedProduct.position.clone();tp.y=faceGroup.getWorldPosition(new THREE.Vector3()).y;faceGroup.lookAt(tp);}
else if(faceGroup)faceGroup.rotation.y+=(0-faceGroup.rotation.y)*0.05;
}
products.forEach((p,i)=>{const ty=i===0?0.75:0.65;p.position.y+=(ty-p.position.y)*0.08;if(p===selectedProduct)p.rotation.y+=dt*0.5;});
TWEEN.update();controls.update();updateBubble();renderer.render(scene,camera);
}
function blink(){if(!eyeL||!eyeR)return;let f=0;const a=()=>{f++;const s=f<=4?1-f/4:f<=8?(f-4)/4:1;eyeL.scale.y=Math.max(0.05,s);eyeR.scale.y=Math.max(0.05,s);if(f<8)requestAnimationFrame(a);};a();}
function onMouseMove(e){mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);document.body.style.cursor=raycaster.intersectObjects(products,true).length>0?'pointer':'default';}
function onClick(e){mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const h=raycaster.intersectObjects(products,true);if(h.length>0){let o=h[0].object;while(o.parent&&!o.userData.id)o=o.parent;if(o.userData.id)selectProduct(o);}}
function selectProduct(p){
if(appState==='PROMOTIONAL_MODE')return;
selectedProduct=p;appState='PRODUCT_SELECTED';const d=p.userData;
document.getElementById('infoName').textContent=d.name;
document.getElementById('infoPrice').textContent=d.price;
document.getElementById('infoDesc').textContent=d.desc;
document.getElementById('infoPanel').classList.add('show');
const mc=displayCases[0];const tp=mc.position.clone();tp.y=0.75;animProd(p,tp);
speak(d.name+'. '+d.desc+'. Precio: '+d.price+' pesos colombianos.');
}
function animProd(p,tgt,cb){new TWEEN.Tween(p.position).to({x:tgt.x,y:tgt.y,z:tgt.z},900).easing(TWEEN.Easing.Quadratic.Out).onComplete(()=>{if(cb)cb();}).start();}
async function speakEL(txt){document.getElementById('loading').classList.add('on');try{const r=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+EL_VOICE,{method:'POST',headers:{'Content-Type':'application/json','xi-api-key':EL_KEY},body:JSON.stringify({text:txt,model_id:EL_MODEL,voice_settings:{stability:0.5,similarity_boost:0.75}})});if(!r.ok)throw new Error(r.status);const b=await r.blob();const u=URL.createObjectURL(b);const a=new Audio(u);document.getElementById('loading').classList.remove('on');a.onplay=()=>{isTalking=true;showBubble(txt)};a.onended=()=>{isTalking=false;hideBubble();URL.revokeObjectURL(u)};a.onerror=()=>{document.getElementById('loading').classList.remove('on');speakFB(txt)};await a.play();}catch(e){document.getElementById('loading').classList.remove('on');speakFB(txt);}}
function speakFB(txt){if(!S){showBubble(txt);return;}S.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';u.rate=0.9;u.pitch=1.05;u.volume=1;const vs=S.getVoices();const p=['Microsoft Sabina','Microsoft Helena','Google espanol','Paulina','es-ES'];let v=null;for(const n of p){v=vs.find(x=>x.name.includes(n));if(v)break;}if(!v)v=vs.find(x=>x.lang.startsWith('es'));if(v)u.voice=v;u.onstart=()=>{isTalking=true;showBubble(txt)};u.onend=()=>{isTalking=false;hideBubble()};S.speak(u);}
function speak(txt){if(!voiceOn){showBubble(txt);return;}if(EL_KEY&&EL_VOICE){speakEL(txt);return;}speakFB(txt);}
function showBubble(t){
document.getElementById('bubbleText').textContent=t;
document.getElementById('bubble').classList.add('show');
updateBubble();
}
function hideBubble(){document.getElementById('bubble').classList.remove('show');}
const bubbleEl=document.getElementById('bubble');
const avatarWorldPos=new THREE.Vector3();
function updateBubble(){
if(!avatar||!bubbleEl.classList.contains('show'))return;
avatar.getWorldPosition(avatarWorldPos);
avatarWorldPos.y+=1.5;
avatarWorldPos.project(camera);
const x=(avatarWorldPos.x*0.5+0.5)*innerWidth;
const y=(-avatarWorldPos.y*0.5+0.5)*innerHeight;
bubbleEl.style.left=x+'px';
bubbleEl.style.top=(y-90)+'px';
bubbleEl.style.transform='translateX(-50%)';
}
window.togglePromo=function(){promoMode=!promoMode;document.getElementById('promoBtn').className=promoMode?'btn active':'btn';if(promoMode){appState='PROMOTIONAL_MODE';promoIndex=0;showNextPromo();}else{clearTimeout(promoTimer);promoTimer=null;appState='IDLE';}};
function showNextPromo(){
if(!promoMode)return;
const d=productData[promoIndex];const p=products[promoIndex];
selectedProduct=p;
document.getElementById('infoName').textContent=d.name;
document.getElementById('infoPrice').textContent=d.price;
document.getElementById('infoDesc').textContent=d.desc;
document.getElementById('infoPanel').classList.add('show');
const mc=displayCases[0];const tp=mc.position.clone();tp.y=0.75;animProd(p,tp);
speak(d.name+'. '+d.price+' pesos colombianos.');
promoTimer=setTimeout(()=>{animProd(p,p.userData.initialPosition.clone());promoIndex=(promoIndex+1)%productData.length;setTimeout(showNextPromo,2000);},10000);
}
window.toggleVoice=function(){voiceOn=!voiceOn;const b=document.getElementById('voiceBtn');b.className=voiceOn?'on':'';b.textContent=voiceOn?'Voz On':'Voz Off';if(!voiceOn){S&&S.cancel();isTalking=false;hideBubble();}};
window.resetCamera=function(){controls.target.set(0,1.2,0);camera.position.set(0,3.5,9);};
window.resetView=function(){selectedProduct=null;appState='IDLE';document.getElementById('infoPanel').classList.remove('show');products.forEach((p,i)=>{animProd(p,p.userData.initialPosition.clone());});if(faceGroup)faceGroup.rotation.y=0;};
window.greet=function(){speak('Hola! Bienvenido a nuestra tienda de postres. Selecciona un producto para conocerlo.');};
document.getElementById('startBtn').onclick=()=>{document.getElementById('splash').classList.add('hide');setTimeout(()=>{document.getElementById('splash').remove();speak('Bienvenido a Chef Byte! Esta es nuestra tienda de postres 3D. Selecciona cualquier postre de la vitrina para conocerlo.');},700);};
initThree();createEnvironment();createProducts();createAvatar();
renderer.domElement.addEventListener('mousemove',onMouseMove);
renderer.domElement.addEventListener('click',onClick);
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
