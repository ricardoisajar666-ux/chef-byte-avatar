<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef Byte - Asistente Virtual</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍰</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0d1b2a 100%);min-height:100vh;overflow:hidden;color:#fff}

.mascot{position:fixed;width:180px;height:260px;z-index:100;cursor:grab;user-select:none;transition:filter .3s}
.mascot:active{cursor:grabbing}
.mascot:hover{filter:drop-shadow(0 0 30px rgba(255,107,107,.5))}

.mascot.idle{animation:mascotIdle 3s ease-in-out infinite}
@keyframes mascotIdle{0%,100%{transform:translateY(0) rotate(0)}33%{transform:translateY(-8px) rotate(.8deg)}66%{transform:translateY(-3px) rotate(-.8deg)}}

.mascot.walking{animation:mascotWalk .5s ease-in-out infinite}
@keyframes mascotWalk{0%,100%{transform:translateY(0) rotate(-2deg)}25%{transform:translateY(-16px) rotate(3deg)}50%{transform:translateY(-3px) rotate(-1deg)}75%{transform:translateY(-20px) rotate(2deg)}}

.mascot.excited{animation:mascotExcited .3s ease infinite}
@keyframes mascotExcited{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.04)}}

.mascot.bounce{animation:mascotBounce .4s ease}
@keyframes mascotBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15) rotate(5deg)}}

/* Pastel */
.cake-base{position:absolute;width:160px;height:85px;background:linear-gradient(180deg,#f5a623,#d4840f);border-radius:18px;bottom:20px;left:50%;transform:translateX(-50%);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 -6px 12px rgba(0,0,0,.2)}
.cake-mid{position:absolute;width:145px;height:50px;background:linear-gradient(180deg,#fff5e6,#ffd4a4);border-radius:14px;bottom:100px;left:50%;transform:translateX(-50%);box-shadow:0 6px 18px rgba(0,0,0,.3),inset 0 4px 10px rgba(255,255,255,.6)}
.cake-top{position:absolute;width:125px;height:42px;background:linear-gradient(180deg,#ffb6c1,#ff7088);border-radius:13px;bottom:145px;left:50%;transform:translateX(-50%);box-shadow:0 5px 14px rgba(0,0,0,.3),inset 0 3px 8px rgba(255,255,255,.5)}

.drip{position:absolute;width:14px;background:linear-gradient(180deg,#fff,#ffe4e1);border-radius:0 0 8px 8px;bottom:140px}
.d1{left:42px;height:24px}.d2{left:62px;height:32px}.d3{right:62px;height:20px}.d4{right:42px;height:28px}

.cherry{position:absolute;width:22px;height:22px;background:radial-gradient(circle at 35% 35%,#ff6b6b,#c0392b);border-radius:50%;top:5px;left:50%;transform:translateX(-50%);box-shadow:0 4px 10px rgba(0,0,0,.4);animation:cherryGlow 2s ease-in-out infinite}
@keyframes cherryGlow{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.4),0 0 12px rgba(255,107,107,.3)}50%{box-shadow:0 4px 10px rgba(0,0,0,.4),0 0 25px rgba(255,107,107,.7)}}
.cherry::before{content:'';position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:3px;height:13px;background:#2d5016;border-radius:2px}

/* Brazos */
.arm{position:absolute;width:38px;height:14px;background:linear-gradient(90deg,#ffb6c1,#ff91a4);border-radius:7px;bottom:75px;z-index:12;transition:transform .25s ease}
.arm.left{left:-28px;transform-origin:right center;transform:rotate(25deg)}
.arm.right{right:-28px;transform-origin:left center;transform:rotate(-25deg)}
.arm.wave{animation:armWave .3s ease infinite}
@keyframes armWave{0%,100%{transform:rotate(25deg)}50%{transform:rotate(-30deg)}}
.arm.point{animation:armPoint .6s ease forwards}
@keyframes armPoint{0%{transform:rotate(-25deg)}100%{transform:rotate(-65deg) translateX(10px)}}

/* Cara */
.face{position:absolute;top:15px;left:50%;transform:translateX(-50%);width:100px;height:70px;z-index:15}

.eye{position:absolute;width:26px;height:30px;background:radial-gradient(circle at 30% 30%,#fff,#f0f0f0 50%,#ddd);border-radius:50%;top:5px;box-shadow:inset 0 2px 5px rgba(0,0,0,.1),0 2px 5px rgba(0,0,0,.2);overflow:hidden;transition:transform .12s ease-out}
.eye.left{left:8px}.eye.right{right:8px}
.pupil{position:absolute;width:12px;height:16px;background:radial-gradient(circle at 30% 30%,#4a4a4a,#1a1a1a);border-radius:50%;top:7px;left:7px;transition:transform .08s ease-out}
.pupil::after{content:'';position:absolute;top:2px;left:2px;width:5px;height:5px;background:#fff;border-radius:50%}

.eye.happy{transform:scaleY(.3) translateY(6px)}
.eye.wink{animation:eyeWink .35s}
@keyframes eyeWink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.08)}}
.eye.surprised{transform:scale(1.3)}

/* Boca mejorada para sincronización */
.mouth{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:40px;height:16px;background:linear-gradient(180deg,#c0392b,#ff6b6b);border-radius:0 0 20px 20px;box-shadow:inset 0 -3px 5px rgba(0,0,0,.3);transition:all .08s ease-out}

/* Estados de boca para hablar - más variados y rápidos */
.mouth.talk-1{height:8px;width:32px;border-radius:0 0 16px 16px}
.mouth.talk-2{height:20px;width:36px;border-radius:0 0 18px 18px}
.mouth.talk-3{height:14px;width:42px;border-radius:0 0 21px 21px}
.mouth.talk-4{height:24px;width:28px;border-radius:0 0 14px 14px}
.mouth.talk-5{height:6px;width:38px;border-radius:0 0 19px 19px}
.mouth.talk-open{height:28px;width:30px;border-radius:0 0 15px 15px}

.mouth.smile{height:22px;border-radius:14px 14px 20px 20px;background:linear-gradient(180deg,#ff6b6b,#ff91a4)}
.mouth.surprised{width:22px;height:22px;border-radius:50%}

.cheek{position:absolute;width:18px;height:12px;background:rgba(255,140,140,.5);border-radius:50%;top:22px;opacity:0;transition:opacity .2s}
.cheek.left{left:-3px}.cheek.right{right:-3px}
.cheek.visible{opacity:1}

/* Humo para explicaciones */
.smoke-wrap{position:fixed;z-index:250;pointer-events:none;opacity:0;transition:all .5s cubic-bezier(.68,-.55,.27,1.55)}
.smoke-wrap.visible{opacity:1}
.smoke-card{background:rgba(15,15,35,.95);border:1px solid rgba(255,107,107,.3);border-radius:16px;padding:20px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px rgba(255,107,107,.1)}
.smoke-emoji{font-size:3rem}
.smoke-name{font-size:1.1rem;font-weight:700;color:#ff6b6b;margin-top:8px}
.smoke-desc{font-size:.85rem;color:#ccc;margin-top:6px;line-height:1.5}
.smoke-price{font-size:1rem;color:#00b894;margin-top:8px;font-weight:700}
.smoke-particles{position:absolute;inset:0;overflow:hidden;border-radius:16px;pointer-events:none}
.smoke-particle{position:absolute;font-size:1.3rem;opacity:.4;animation:smokePartFloat 4s ease-in-out infinite}
@keyframes smokePartFloat{0%,100%{transform:translateY(0) rotate(0);opacity:.2}50%{transform:translateY(-15px) rotate(10deg);opacity:.5}}

/* Partículas */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200}
.particle{position:absolute;font-size:1.1rem;animation:particleFly 1s ease-out forwards}
@keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.2) rotate(360deg)}}

/* Burbuja */
.speech-bubble{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(15,15,35,.95);border:1px solid rgba(255,107,107,.4);border-radius:16px;padding:14px 24px;max-width:500px;min-width:260px;box-shadow:0 10px 35px rgba(0,0,0,.4),0 0 20px rgba(255,107,107,.1);z-index:150;text-align:center;opacity:0;transition:all .3s ease;pointer-events:none}
.speech-bubble.visible{opacity:1;pointer-events:auto}
.speech-bubble::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);border-width:12px 12px 0;border-style:solid;border-color:rgba(15,15,35,.95) transparent transparent}
.speech-text{font-size:.9rem;color:#eee;line-height:1.5}

/* Controles - Panel lateral */
.ctrl-panel{position:fixed;top:12px;left:12px;z-index:200;display:flex;flex-direction:column;gap:6px}
.btn{padding:10px 16px;border:1px solid rgba(255,255,255,.1);border-radius:12px;font-size:.8rem;cursor:pointer;transition:all .2s;font-weight:600;background:rgba(255,255,255,.08);color:#fff;backdrop-filter:blur(10px);letter-spacing:.3px}
.btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,107,107,.5);transform:translateX(4px)}
.btn:active{transform:scale(.96)}
.btn-accent{background:linear-gradient(135deg,#ff6b6b,#ee5a24);border-color:transparent}
.btn-accent:hover{background:linear-gradient(135deg,#ff7070,#f06030);box-shadow:0 4px 20px rgba(255,107,107,.4)}

/* Barra inferior */
.voice-bar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:200}
.v-btn{padding:8px 16px;border:1px solid rgba(255,255,255,.15);border-radius:10px;font-size:.8rem;cursor:pointer;font-weight:600;transition:all .2s;background:rgba(255,255,255,.08);color:#fff;backdrop-filter:blur(10px)}
.v-btn:hover{background:rgba(255,255,255,.15)}
.v-btn.active{background:linear-gradient(135deg,#00b894,#00cec9);border-color:transparent}

/* Estrellas */
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.8;transform:scale(1.4)}}

/* Productos - Grid */
.products-panel{position:fixed;top:50%;right:16px;transform:translateY(-50%);z-index:200;display:flex;flex-direction:column;gap:8px}
.product-card{background:rgba(15,15,35,.9);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 16px;cursor:pointer;transition:all .25s;backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;min-width:160px}
.product-card:hover{border-color:rgba(255,107,107,.6);transform:translateX(-6px);box-shadow:0 4px 20px rgba(255,107,107,.2)}
.product-card .emoji{font-size:1.5rem}
.product-card .info{text-align:left}
.product-card .name{font-size:.82rem;font-weight:600;color:#fff}
.product-card .price{font-size:.75rem;color:#00b894;margin-top:2px}

/* Info cards */
.info-panel{position:fixed;bottom:60px;left:12px;z-index:200;display:flex;flex-direction:column;gap:6px}
.info-card{background:rgba(15,15,35,.85);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 14px;cursor:pointer;transition:all .2s;backdrop-filter:blur(10px);font-size:.78rem;color:#ccc}
.info-card:hover{border-color:rgba(0,184,148,.5);color:#fff;transform:translateX(4px)}

/* Modal receta */
.recipe-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:400;max-width:420px;width:90%;max-height:80vh;overflow-y:auto;background:rgba(15,15,35,.98);border:1px solid rgba(255,107,107,.3);border-radius:18px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(255,107,107,.1);transition:transform .35s cubic-bezier(.68,-.55,.27,1.55);opacity:0}
.recipe-modal.open{transform:translate(-50%,-50%) scale(1);opacity:1}
.recipe-modal h2{font-size:1.2rem;color:#ff6b6b;margin-bottom:12px}
.recipe-modal h3{color:#00b894;margin:12px 0 6px;font-size:.9rem}
.recipe-modal ul,.recipe-modal ol{padding-left:18px}
.recipe-modal li{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.85rem;color:#ccc}
.recipe-close{position:absolute;top:12px;right:16px;background:none;border:none;font-size:1.4rem;cursor:pointer;color:#888;transition:color .2s}
.recipe-close:hover{color:#ff6b6b}

/* Logo / Brand */
.brand{position:fixed;top:12px;right:16px;z-index:200;text-align:right}
.brand-name{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#ff6b6b,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.brand-tag{font-size:.7rem;color:#888;letter-spacing:2px;text-transform:uppercase;margin-top:2px}

@media(max-width:700px){
.mascot{width:140px;height:200px}
.cake-base{width:120px;height:65px}
.cake-mid{width:105px;height:38px;bottom:80px}
.cake-top{width:95px;height:32px;bottom:112px}
.face{top:12px;width:80px;height:55px}
.eye{width:20px;height:24px}.pupil{width:9px;height:11px}
.mouth{width:32px;height:14px}
.arm{width:28px;height:10px}.arm.left{left:-20px}.arm.right{right:-20px}
.ctrl-panel{top:auto;bottom:70px;left:8px}
.products-panel{top:auto;bottom:120px;right:8px}
.speech-bubble{bottom:90px;max-width:280px;min-width:200px}
.brand{top:8px;right:8px}
.brand-name{font-size:1.1rem}
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="particles" id="particles"></div>

<div class="brand">
    <div class="brand-name">CHEF BYTE</div>
    <div class="brand-tag">Cocina Digital</div>
</div>

<div class="mascot idle" id="mascot">
    <div class="cherry"></div>
    <div class="cake-top"></div>
    <div class="drip d1"></div><div class="drip d2"></div><div class="drip d3"></div><div class="drip d4"></div>
    <div class="cake-mid"></div>
    <div class="cake-base">
        <div class="arm left" id="armL"></div>
        <div class="arm right" id="armR"></div>
        <div class="face">
            <div class="eye left" id="eyeL"><div class="pupil" id="pupilL"></div></div>
            <div class="eye right" id="eyeR"><div class="pupil" id="pupilR"></div></div>
            <div class="cheek left" id="cheekL"></div>
            <div class="cheek right" id="cheekR"></div>
            <div class="mouth" id="mouth"></div>
        </div>
    </div>
</div>

<div class="smoke-wrap" id="smokeWrap">
    <div class="smoke-card">
        <div class="smoke-particles" id="smokeParticles"></div>
        <div class="smoke-emoji" id="smokeEmoji"></div>
        <div class="smoke-name" id="smokeName"></div>
        <div class="smoke-desc" id="smokeDesc"></div>
        <div class="smoke-price" id="smokePrice"></div>
    </div>
</div>

<div class="speech-bubble" id="speechBubble"><p class="speech-text" id="speechText"></p></div>

<!-- Panel de productos -->
<div class="products-panel">
    <div class="product-card" onclick="showProduct('cake')">
        <span class="emoji">🍰</span>
        <div class="info"><div class="name">Pastel Chocolate</div><div class="price">$89</div></div>
    </div>
    <div class="product-card" onclick="showProduct('pasta')">
        <span class="emoji">🍝</span>
        <div class="info"><div class="name">Pasta Italiana</div><div class="price">$99</div></div>
    </div>
    <div class="product-card" onclick="showProduct('tacos')">
        <span class="emoji">🌮</span>
        <div class="info"><div class="name">Tacos Gourmet</div><div class="price">$79</div></div>
    </div>
    <div class="product-card" onclick="showProduct('sushi')">
        <span class="emoji">🍣</span>
        <div class="info"><div class="name">Sushi Premium</div><div class="price">$149</div></div>
    </div>
</div>

<!-- Panel info -->
<div class="info-panel">
    <div class="info-card" onclick="showMenu()">📋 Menú completo</div>
    <div class="info-card" onclick="showSpecials()">⭐ Especial del día</div>
    <div class="info-card" onclick="showPrices()">💰 Precios</div>
    <div class="info-card" onclick="showHours()">🕐 Horarios</div>
    <div class="info-card" onclick="showLocation()">📍 Ubicación</div>
</div>

<!-- Barra inferior -->
<div class="voice-bar">
    <button class="v-btn active" id="voiceBtn" onclick="toggleVoice()">🔊 Voz</button>
    <button class="v-btn" id="speedBtn" onclick="changeSpeed()">⚡ Normal</button>
    <button class="v-btn" onclick="greet()">👋 Saludar</button>
</div>

<!-- Modal receta -->
<div class="recipe-modal" id="recipeModal">
    <button class="recipe-close" onclick="closeRecipe()">✕</button>
    <h2 id="rTitle"></h2>
    <h3>Ingredientes:</h3><ul id="rIng"></ul>
    <h3>Preparación:</h3><ol id="rSteps"></ol>
</div>

<!-- Splash screen -->
<div id="splash" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer">
    <div style="font-size:5rem;margin-bottom:20px;animation:float 2s ease-in-out infinite">🍰</div>
    <div style="font-size:2rem;font-weight:800;background:linear-gradient(135deg,#ff6b6b,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px">CHEF BYTE</div>
    <div style="color:#888;font-size:.9rem;margin-bottom:30px">Asistente Gastronómico Virtual</div>
    <div style="padding:14px 40px;background:linear-gradient(135deg,#ff6b6b,#ee5a24);border-radius:30px;color:#fff;font-weight:700;font-size:1rem;animation:pulse 1.5s ease-in-out infinite">CLIC PARA INICIAR</div>
    <style>@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.5)}50%{box-shadow:0 0 0 15px rgba(255,107,107,0)}}</style>
</div>

<script>
let voiceOn=true, rate=0.88, autoMode=false, autoTimer=null;
let dragging=false, dragOff={x:0,y:0};
let cx=innerWidth/2-90, cy=innerHeight/3;
const S=window.speechSynthesis, M=document.getElementById('mascot');
let talkInterval=null, mouthState=0;

// ========== INIT ==========
function init(){
    M.style.left=cx+'px'; M.style.top=cy+'px';
    mkStars(); setupDrag(); trackMouse();
    
    // Splash screen - clic para iniciar (requerido por navegadores)
    document.getElementById('splash').addEventListener('click',function(){
        this.style.opacity='0';
        this.style.transition='opacity .4s';
        setTimeout(()=>{this.remove();speak('Bienvenido a Chef Byte. Selecciona un platillo para conocer nuestra propuesta gastronómica.')},400);
        document.getElementById('armL').classList.add('wave');
        setTimeout(()=>document.getElementById('armL').classList.remove('wave'),1800);
    });
}

// ========== VOZ ==========
function speak(txt){
    if(!voiceOn){showBubble(txt);return}
    if(!S){showBubble(txt);return}
    S.cancel();
    
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='es-MX';
    u.rate=rate;
    u.pitch=1.0;
    u.volume=1;
    
    // Seleccionar voz española disponible
    const vs=S.getVoices();
    let v=vs.find(x=>x.lang==='es-MX')||vs.find(x=>x.lang==='es-ES')||vs.find(x=>x.lang.startsWith('es'));
    if(v)u.voice=v;
    
    u.onstart=()=>{
        startMouthSync();
        M.classList.remove('idle');
        M.classList.add('excited');
        showBubble(txt);
    };
    u.onend=()=>{
        stopMouthSync();
        M.classList.remove('excited');
        setExpr('happy');
        setTimeout(()=>setExpr(''),2000);
    };
    u.onerror=()=>{
        stopMouthSync();
        showBubble(txt);
    };
    S.speak(u);
}

// ========== BOCA SINCRONIZADA ==========
function startMouthSync(){
    stopMouthSync();
    mouthState=0;
    const mouth=document.getElementById('mouth');
    const states=['talk-1','talk-2','talk-3','talk-4','talk-5','talk-open'];
    
    talkInterval=setInterval(()=>{
        mouth.className='mouth';
        const state=states[Math.floor(Math.random()*states.length)];
        mouth.classList.add(state);
        mouthState++;
    },80+Math.random()*40);
}

function stopMouthSync(){
    if(talkInterval){clearInterval(talkInterval);talkInterval=null}
    const mouth=document.getElementById('mouth');
    mouth.className='mouth';
}

// ========== EXPRESIONES ==========
function setExpr(t){
    const el=document.getElementById('eyeL'),er=document.getElementById('eyeR'),m=document.getElementById('mouth');
    const cl=document.getElementById('cheekL'),cr=document.getElementById('cheekR');
    el.className='eye left';er.className='eye right';m.className='mouth';
    cl.classList.remove('visible');cr.classList.remove('visible');
    switch(t){
        case'happy':el.classList.add('happy');er.classList.add('happy');m.classList.add('smile');cl.classList.add('visible');cr.classList.add('visible');break;
        case'surprised':el.classList.add('surprised');er.classList.add('surprised');m.classList.add('surprised');break;
        case'wink':el.classList.add('happy');er.classList.add('wink');m.classList.add('smile');break;
    }
}

function showBubble(t){
    document.getElementById('speechText').textContent=t;
    document.getElementById('speechBubble').classList.add('visible');
}
function hideBubble(){document.getElementById('speechBubble').classList.remove('visible')}

function toggleVoice(){
    voiceOn=!voiceOn;
    const b=document.getElementById('voiceBtn');
    b.className=voiceOn?'v-btn active':'v-btn';
    b.textContent=voiceOn?'🔊 Voz':'🔇 Mute';
    if(!voiceOn){S.cancel();stopMouthSync();setExpr('');hideBubble()}
}

function changeSpeed(){
    const sp=[.7,.88,1,1.15,1.3];
    const lb=['Lenta','Normal','Media','Rápida','Muy Rápida'];
    const i=sp.indexOf(rate);
    rate=sp[(i+1)%sp.length];
    document.getElementById('speedBtn').textContent='⚡ '+lb[(i+1)%sp.length];
}

// ========== PRODUCTOS ==========
const prodDB={

function showProduct(type){
    const d=prodDB[type];
    const sw=document.getElementById('smokeWrap');
    document.getElementById('smokeEmoji').textContent=d.emoji;
    document.getElementById('smokeName').textContent=d.name;
    document.getElementById('smokeDesc').textContent=d.desc;
    document.getElementById('smokePrice').textContent=d.price;
    
    const sp=document.getElementById('smokeParticles');sp.innerHTML='';
    const smokeEmj=['💨','☁️','🌫️'];
    for(let i=0;i<6;i++){
        const p=document.createElement('div');p.className='smoke-particle';
        p.textContent=smokeEmj[~~(Math.random()*smokeEmj.length)];
        p.style.cssText=`left:${Math.random()*90}%;top:${Math.random()*90}%;animation-delay:${Math.random()*2}s`;
        sp.appendChild(p);
    }
    
    const r=M.getBoundingClientRect();
    sw.style.left=Math.min(r.right+15,innerWidth-240)+'px';
    sw.style.top=Math.max(r.top,10)+'px';
    sw.classList.add('visible');
    
    setExpr('surprised');
    setTimeout(()=>setExpr('happy'),300);
    spawnP(8);
    
    // Modal receta
    document.getElementById('rTitle').textContent=d.emoji+' '+d.name;
    document.getElementById('rIng').innerHTML=d.ing.map(x=>'<li>'+x+'</li>').join('');
    document.getElementById('rSteps').innerHTML=d.prep.map(x=>'<li>'+x+'</li>').join('');
    
    walkTo(innerWidth/2-90,innerHeight/4,()=>{
        speak(d.name+'. '+d.desc);
        document.getElementById('recipeModal').classList.add('open');
        document.getElementById('armR').classList.add('point');
        setTimeout(()=>document.getElementById('armR').classList.remove('point'),3000);
    });
    
    setTimeout(()=>sw.classList.remove('visible'),7000);
}

// ========== UTILS ==========
function mkStars(){const c=document.getElementById('stars');for(let i=0;i<50;i++){const s=document.createElement('div');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2}s;animation-duration:${1.5+Math.random()*2}s`;c.appendChild(s)}}

function setupDrag(){
    M.addEventListener('mousedown',dStart);M.addEventListener('touchstart',dStart,{passive:false});
    document.addEventListener('mousemove',dMove);document.addEventListener('touchmove',dMove,{passive:false});
    document.addEventListener('mouseup',dEnd);document.addEventListener('touchend',dEnd);
}
function dStart(e){e.preventDefault();dragging=true;M.classList.remove('idle','walking');M.classList.add('excited');const p=e.touches?e.touches[0]:e;dragOff.x=p.clientX-M.offsetLeft;dragOff.y=p.clientY-M.offsetTop}
function dMove(e){if(!dragging)return;e.preventDefault();const p=e.touches?e.touches[0]:e;cx=p.clientX-dragOff.x;cy=p.clientY-dragOff.y;M.style.left=cx+'px';M.style.top=cy+'px'}
function dEnd(){if(!dragging)return;dragging=false;M.classList.remove('excited');spawnP(4)}

function trackMouse(){
    document.addEventListener('mousemove',e=>{
        if(dragging)return;
        const r=M.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/80,dy=(e.clientY-r.top-r.height/2)/80;
        const pl=document.getElementById('pupilL'),pr=document.getElementById('pupilR');
        if(pl)pl.style.transform=`translate(${dx}px,${dy}px)`;
        if(pr)pr.style.transform=`translate(${dx}px,${dy}px)`;
    });
}

function walkTo(tx,ty,cb){
    M.classList.remove('idle');
    M.classList.add('walking');
    const sx=cx,sy=cy,d=Math.sqrt((tx-sx)**2+(ty-sy)**2);
    const dur=Math.min(d*2.5,2000),st=Date.now();
    (function anim(){
        const t=Math.min((Date.now()-st)/dur,1);
        const e=1-Math.pow(1-t,3);
        cx=sx+(tx-sx)*e; cy=sy+(ty-sy)*e;
        M.style.left=cx+'px'; M.style.top=cy+'px';
        M.style.transform=tx>sx?'scaleX(1)':'scaleX(-1)';
        t<1?requestAnimationFrame(anim):(()=>{
            M.classList.remove('walking');M.style.transform='';
            if(cb)cb();
        });
    })();
}

function spawnP(n){
    const c=document.getElementById('particles'),emj=['✨','⭐','💫','🌟','🍰','🧁'];
    for(let i=0;i<n;i++){
        const p=document.createElement('div');p.className='particle';
        p.textContent=emj[~~(Math.random()*emj.length)];
        const r=M.getBoundingClientRect();
        p.style.left=(r.left+r.width/2)+'px';p.style.top=(r.top+r.height/2)+'px';
        p.style.setProperty('--tx',(Math.random()-.5)*200+'px');
        p.style.setProperty('--ty',(Math.random()-.5)*200-50+'px');
        c.appendChild(p);setTimeout(()=>p.remove(),1000);
    }
}
