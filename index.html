<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef Byte - Tienda de Postres v16</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍰</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5e6d3;overflow:hidden;color:#333}
canvas{display:block;position:fixed;inset:0;z-index:1}
.brand{position:fixed;top:14px;right:16px;z-index:100;text-align:right}
.brand h1{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#ff6b6b,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.brand p{font-size:.6rem;color:#888;letter-spacing:4px;text-transform:uppercase;margin-top:3px}
.panel{position:fixed;top:14px;left:14px;z-index:100;display:flex;flex-direction:column;gap:6px}
.btn{padding:9px 16px;border:1px solid rgba(0,0,0,.08);border-radius:10px;font-size:.78rem;cursor:pointer;transition:all .3s;font-weight:600;background:rgba(255,255,255,.85);color:#555;backdrop-filter:blur(10px)}
.btn:hover{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.3);color:#333;transform:translateX(4px)}
.btn.active{background:linear-gradient(135deg,#ff6b6b,#ee5a24);border-color:transparent;color:#fff}
.info-panel{position:fixed;bottom:14px;left:14px;z-index:100;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.06);border-radius:14px;padding:16px 20px;min-width:240px;max-width:320px;backdrop-filter:blur(12px);transition:all .4s;opacity:0;transform:translateY(10px);box-shadow:0 4px 20px rgba(0,0,0,.08)}
.info-panel.show{opacity:1;transform:translateY(0)}
.info-panel h3{font-size:.95rem;color:#ff6b6b;margin-bottom:6px}
.info-panel .price{font-size:1.1rem;color:#00b894;font-weight:700;margin:6px 0}
.info-panel .desc{font-size:.78rem;color:#777;line-height:1.5}
.bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:100}
.bar button{padding:8px 16px;border:1px solid rgba(0,0,0,.08);border-radius:10px;font-size:.78rem;cursor:pointer;font-weight:600;background:rgba(255,255,255,.85);color:#555;backdrop-filter:blur(10px);transition:all .3s}
.bar button:hover{background:rgba(255,255,255,1);color:#333}
.bar button.on{background:linear-gradient(135deg,#00b894,#00cec9);border-color:transparent;color:#fff}
.bubble{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(15px);background:rgba(255,255,255,.95);border:1px solid rgba(255,107,107,.2);border-radius:16px;padding:14px 22px;max-width:500px;min-width:260px;box-shadow:0 10px 35px rgba(0,0,0,.1);z-index:100;text-align:center;opacity:0;transition:all .4s;pointer-events:none}
.bubble.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bubble::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);border-width:12px;border-style:solid;border-color:rgba(255,255,255,.95) transparent transparent}
.bubble p{font-size:.85rem;color:#444;line-height:1.55}
.splash{position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,#fff5ee,#ffe4d6,#ffd4c4);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .6s}
.splash.hide{opacity:0;pointer-events:none}
.splash h1{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,#ff6b6b,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;letter-spacing:3px}
.splash p{color:#999;font-size:.75rem;letter-spacing:5px;text-transform:uppercase;margin-bottom:30px}
.splash button{padding:14px 45px;background:linear-gradient(135deg,#ff6b6b,#ee5a24);border:none;border-radius:28px;color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .3s;box-shadow:0 8px 28px rgba(255,107,107,.35);letter-spacing:1.5px}
.splash button:hover{transform:scale(1.06);box-shadow:0 10px 38px rgba(255,107,107,.5)}
.loading{position:fixed;bottom:45px;left:50%;transform:translateX(-50%);background:rgba(0,184,148,.92);color:#fff;padding:7px 18px;border-radius:18px;font-size:.78rem;font-weight:600;z-index:300;display:none;align-items:center;gap:7px}
.loading.on{display:flex}
.loading::before{content:'';width:11px;height:11px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.bar{bottom:55px}}
</style>
</head>
<body>
<div class="splash" id="splash"><h1>CHEF BYTE</h1><p>Tienda de Postres 3D</p><button id="startBtn">ENTRAR A LA TIENDA</button></div>
<div class="brand"><h1>CHEF BYTE</h1><p>Pasteleria Virtual</p></div>
<div class="panel">
<button class="btn" id="promoBtn" onclick="togglePromo()">Modo Promocion</button>
<button class="btn" onclick="resetCamera()">Camara</button>
<button class="btn" onclick="greet()">Saludar</button>
</div>
<div class="bar">
<button class="on" id="voiceBtn" onclick="toggleVoice()">Voz On</button>
<button onclick="resetView()">Reset</button>
</div>
<div class="info-panel" id="infoPanel"><h3 id="infoName"></h3><div class="price" id="infoPrice"></div><div class="desc" id="infoDesc"></div></div>
<div class="bubble" id="bubble"><p id="bubbleText"></p></div>
<div class="loading" id="loading">Generando voz...</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="app.js"></script>
</body>
</html>
