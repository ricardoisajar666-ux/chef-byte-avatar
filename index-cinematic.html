<!DOCTYPE html>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍰</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
canvas{display:block}
.ui{position:fixed;top:20px;left:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.btn{padding:10px 18px;border:1px solid rgba(255,255,255,.15);border-radius:8px;font-size:.75rem;cursor:pointer;background:rgba(0,0,0,.6);color:rgba(255,255,255,.7);backdrop-filter:blur(12px);transition:all .3s;font-weight:500}
.btn:hover{background:rgba(255,107,107,.2);border-color:rgba(255,107,107,.4);color:#fff}
.btn.on{background:linear-gradient(135deg,rgba(255,107,107,.8),rgba(238,90,36,.8));border-color:transparent;color:#fff}
.brand{position:fixed;top:20px;right:20px;text-align:right;z-index:100}
.brand h1{font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,#ff6b6b,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand p{font-size:.55rem;color:rgba(255,255,255,.4);letter-spacing:4px;text-transform:uppercase;margin-top:4px}
.bubble{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);border:1px solid rgba(255,107,107,.25);border-radius:20px;padding:16px 28px;max-width:500px;min-width:250px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:100;opacity:0;transition:all .5s;pointer-events:none;backdrop-filter:blur(20px)}
.bubble.show{opacity:1;transform:translateX(-50%) translateY(-5px)}
.bubble p{font-size:.85rem;color:rgba(255,255,255,.9);line-height:1.6}
.film-bar{position:fixed;left:0;right:0;height:50px;background:#000;z-index:50;pointer-events:none}
.film-bar.top{top:0}
.film-bar.bottom{bottom:0}
.vignette{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:40;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.5) 100%)}
.fps-display{position:fixed;bottom:60px;right:20px;color:rgba(255,215,100,.5);font-family:monospace;font-size:11px;z-index:100}
.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.6);font-size:.8rem;letter-spacing:3px;text-transform:uppercase;z-index:200;opacity:0;transition:opacity .3s}
.loading.on{opacity:1}
</style>
</head>
<body>
<div class="film-bar top"></div>
<div class="film-bar bottom"></div>
<div class="vignette"></div>
<div class="brand"><h1>CHEF BYTE</h1><p>Cinematic Avatar</p><p style="color:rgba(255,107,107,.6);font-size:.5rem;margin-top:8px;letter-spacing:2px">PROYECTO DIA DE LA CIENCIA</p></div>
<div class="ui">
<button class="btn on" id="voiceBtn">Voz On</button>
<button class="btn" id="greetBtn">Saludar</button>
<button class="btn" id="camBtn">Camara Cinematica</button>
</div>
<div class="bubble" id="bubble"><p id="bubbleText"></p></div>
<div class="loading" id="loading">GENERANDO AUDIO...</div>
<div class="fps-display" id="fps">60 FPS</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';

let scene,camera,renderer,controls,clock,composer;
let avatar,faceGroup,eyeL,eyeR,mouthObj,cherryObj,cherryStem,cherryLeaf;

let voiceOn=true,isTalking=false,cinematicCam=false,camPhase=0;

scene.background=new THREE.Color(0x0a0a18);

camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,100);

renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);

controls.dampingFactor=0.04;

composer=new EffectComposer(renderer);

const bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.4,0.3,0.8);

const filmGrainShader={uniforms:{tDiffuse:{value:null},time:{value:0}},vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",fragmentShader:"uniform sampler2D tDiffuse;uniform float time;varying vec2 vUv;float rand(vec2 co){return fract(sin(dot(co.xy,vec2(12.9898,78.233)))*43758.5453);}void main(){vec4 color=texture2D(tDiffuse,vUv);color.rgb+=rand(vUv*time)*0.025;float vig=1.0-0.3*length(vUv-0.5);color.rgb*=vig;gl_FragColor=color;}"};
const filmPass=new ShaderPass(filmGrainShader);

const chromAbShader={uniforms:{tDiffuse:{value:null}},vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",fragmentShader:"uniform sampler2D tDiffuse;varying vec2 vUv;void main(){vec2 uv=vUv;float d=distance(uv,vec2(0.5));float offset=d*0.003;vec4 cr=texture2D(tDiffuse,uv+vec2(offset,0.0));vec4 cg=texture2D(tDiffuse,uv);vec4 cb=texture2D(tDiffuse,uv-vec2(offset,0.0));gl_FragColor=vec4(cr.r,cg.g,cb.b,cg.a);}"};
const chromPass=new ShaderPass(chromAbShader);
composer.addPass(chromPass);

scene.add(new THREE.HemisphereLight(0xffeedd,0x2a2a4e,0.7));

const keyLight=new THREE.DirectionalLight(0xfff0d0,1.8);

for(let i=0;i<godRayCount;i++){

for(let i=0;i<sparkleCount;i++){

}
sparkleGeo.setAttribute('position',new THREE.BufferAttribute(sparklePos,3));
const sparkleMat=new THREE.PointsMaterial({color:0xffd700,size:0.035,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending});

const platform=new THREE.Mesh(new THREE.CylinderGeometry(0.85,1.0,0.08,48),new THREE.MeshStandardMaterial({color:0x1a1a2e,roughness:0.2,metalness:0.7}));
platform.position.y=-0.32;platform.receiveShadow=true;platform.castShadow=true;
scene.add(platform);

const floorTex=new THREE.Mesh(new THREE.CylinderGeometry(0.82,0.82,0.02,48),new THREE.MeshStandardMaterial({color:0xfff5ee,roughness:0.35,metalness:0.0}));
floorTex.position.y=-0.27;scene.add(floorTex);

const ring1=new THREE.Mesh(new THREE.TorusGeometry(0.95,0.018,12,64),new THREE.MeshStandardMaterial({color:0xff6b6b,roughness:0.15,metalness:0.5,emissive:0xff6b6b,emissiveIntensity:0.3}));
ring1.position.y=-0.28;ring1.rotation.x=Math.PI/2;scene.add(ring1);

const ring2=new THREE.Mesh(new THREE.TorusGeometry(1.08,0.01,12,64),new THREE.MeshStandardMaterial({color:0xf5a623,roughness:0.25,metalness:0.4,emissive:0xf5a623,emissiveIntensity:0.2}));
ring2.position.y=-0.28;ring2.rotation.x=Math.PI/2;scene.add(ring2);

function createMiniCake(color,accent){
const g=new THREE.Group();
const base=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,0.04,16),new THREE.MeshPhysicalMaterial({color:color,roughness:0.3,clearcoat:0.5}));
base.position.y=0.02;g.add(base);
const mid=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.05,0.03,16),new THREE.MeshPhysicalMaterial({color:accent,roughness:0.2,clearcoat:0.6}));
mid.position.y=0.055;g.add(mid);
const top=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.04,0.025,16),new THREE.MeshPhysicalMaterial({color:0xff9ab0,roughness:0.15,clearcoat:0.7}));
top.position.y=0.08;g.add(top);
const cherry=new THREE.Mesh(new THREE.SphereGeometry(0.012,12,12),new THREE.MeshPhysicalMaterial({color:0xff3344,roughness:0.1,clearcoat:0.9,emissive:0xff2233,emissiveIntensity:0.2}));

}

function createCupcake(color){

}

function createMacaron(color,accent){
const g=new THREE.Group();
const top=new THREE.Mesh(new THREE.SphereGeometry(0.04,16,8,0,Math.PI*2,0,Math.PI/2),new THREE.MeshPhysicalMaterial({color:color,roughness:0.15,clearcoat:0.6}));

}

function createDonut(color,glaze){
const g=new THREE.Group();
const body=new THREE.Mesh(new THREE.TorusGeometry(0.035,0.015,12,24),new THREE.MeshPhysicalMaterial({color:color,roughness:0.25,clearcoat:0.5}));

function createStrawberry(){
const g=new THREE.Group();

function createBlueberry(){
return new THREE.Mesh(new THREE.SphereGeometry(0.018,12,12),new THREE.MeshPhysicalMaterial({color:0x5577cc,roughness:0.1,clearcoat:0.8,emissive:0x3355aa,emissiveIntensity:0.15}));
}

const miniPositions=[
{x:0.3,z:0.35},{x:-0.3,z:0.35},{x:0.45,z:0.1},{x:-0.45,z:0.1},
{x:0.35,z:-0.25},{x:-0.35,z:-0.25},{x:0,z:0.45},{x:0.5,z:-0.15},{x:-0.5,z:-0.15}
];

miniPositions.forEach((p,i)=>{
let item;
if(i%5===0)item=createMiniCake(0xf5a623,0xffe8d0);
else if(i%5===1)item=createCupcake(0xff69b4);
else if(i%5===2)item=createMacaron(0xffb6c1,0xff69b4);
else if(i%5===3)item=createDonut(0xf5a623,0xff6b6b);
else item=createStrawberry();

const angle=Math.atan2(p.z,p.x);
item.position.set(p.x,-0.25,p.z);
item.rotation.y=angle;
item.scale.setScalar(0.8+Math.random()*0.4);
scene.add(item);
});

for(let i=0;i<8;i++){
const blue=createBlueberry();
const a=(i/8)*Math.PI*2;
blue.position.set(Math.cos(a)*0.65,-0.25,Math.sin(a)*0.65);
scene.add(blue);
}

for(let i=0;i<6;i++){
const straw=createStrawberry();
const a=(i/6)*Math.PI*2+0.3;
straw.position.set(Math.cos(a)*0.72,-0.25,Math.sin(a)*0.72);
straw.rotation.z=Math.sin(a)*0.3;
scene.add(straw);
}

avatar=new THREE.Group();

const matBase=new THREE.MeshPhysicalMaterial({color:0xf5a623,roughness:0.25,metalness:0.05,clearcoat:0.5,clearcoatRoughness:0.2,emissive:0xf5a623,emissiveIntensity:0.05});
const matMid=new THREE.MeshPhysicalMaterial({color:0xffe8d0,roughness:0.2,metalness:0.02,clearcoat:0.6,clearcoatRoughness:0.15,emissive:0xffe8d0,emissiveIntensity:0.03});
const matTop=new THREE.MeshPhysicalMaterial({color:0xff9ab0,roughness:0.15,metalness:0.03,clearcoat:0.7,clearcoatRoughness:0.1,emissive:0xff9ab0,emissiveIntensity:0.05});
const matCherry=new THREE.MeshPhysicalMaterial({color:0xff2244,roughness:0.08,metalness:0.1,clearcoat:1.0,clearcoatRoughness:0.02,transmission:0.2,thickness:0.4,emissive:0xff1133,emissiveIntensity:0.3});
const matSkin=new THREE.MeshPhysicalMaterial({color:0xffb0c0,roughness:0.35,clearcoat:0.3});
const matFrosting=new THREE.MeshPhysicalMaterial({color:0xfff5ee,roughness:0.1,metalness:0.0,clearcoat:0.8,clearcoatRoughness:0.08,transmission:0.08,thickness:0.3,emissive:0xfff5ee,emissiveIntensity:0.05});

const base=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.55,0.3,48),matBase);
base.position.y=0.15;base.castShadow=true;avatar.add(base);

const frostingBase=new THREE.Mesh(new THREE.CylinderGeometry(0.52,0.52,0.04,48),matFrosting);
frostingBase.position.y=0.31;avatar.add(frostingBase);

for(let i=0;i<12;i++){

const frostingMid=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.035,48),matFrosting);

for(let i=0;i<10;i++){

const topLayer=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.36,0.18,48),matTop);

const frostingTop=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.03,48),matFrosting);

for(let i=0;i<8;i++){

const a=(i/8)*Math.PI*2;
const h=0.01+Math.random()*0.025;

cherryStem=new THREE.Mesh(new THREE.CylinderGeometry(0.004,0.004,0.08,8),new THREE.MeshStandardMaterial({color:0x2d5a1e,roughness:0.5}));
cherryStem.position.y=0.86;cherryStem.rotation.z=0.2;avatar.add(cherryStem);

function createFruitDecor(type){
const g=new THREE.Group();
if(type==='strawberry'){
const body=new THREE.Mesh(new THREE.SphereGeometry(0.035,12,12),new THREE.MeshPhysicalMaterial({color:0xff2244,roughness:0.15,clearcoat:0.7,emissive:0xff1133,emissiveIntensity:0.2}));
body.scale.set(0.8,1.1,0.8);g.add(body);
const leaf=new THREE.Mesh(new THREE.ConeGeometry(0.02,0.015,6),new THREE.MeshPhysicalMaterial({color:0x2d8a1e,roughness:0.35}));
leaf.position.y=0.038;g.add(leaf);
}else if(type==='blueberry'){
g.add(new THREE.Mesh(new THREE.SphereGeometry(0.022,12,12),new THREE.MeshPhysicalMaterial({color:0x5577cc,roughness:0.1,clearcoat:0.8,emissive:0x3355aa,emissiveIntensity:0.2})));
}else if(type==='mint'){
const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.018,10,10),new THREE.MeshPhysicalMaterial({color:0x44bb44,roughness:0.25,side:THREE.DoubleSide}));
leaf.scale.set(0.4,1,0.8);g.add(leaf);
}
return g;
}

const fruitL=createFruitDecor('strawberry');
fruitL.position.set(-0.52,0.22,0.12);fruitL.rotation.z=0.3;fruitL.name='fruitL';avatar.add(fruitL);

const fruitR=createFruitDecor('strawberry');
fruitR.position.set(0.52,0.22,0.12);fruitR.rotation.z=-0.3;fruitR.name='fruitR';avatar.add(fruitR);

const blueL=createFruitDecor('blueberry');blueL.position.set(-0.55,0.18,0);avatar.add(blueL);
const blueR=createFruitDecor('blueberry');blueR.position.set(0.55,0.18,0);avatar.add(blueR);

const mintL=createFruitDecor('mint');mintL.position.set(-0.35,0.53,0.28);mintL.rotation.z=0.5;avatar.add(mintL);
const mintR=createFruitDecor('mint');mintR.position.set(0.35,0.53,0.28);mintR.rotation.z=-0.5;avatar.add(mintR);
const mintTop=createFruitDecor('mint');mintTop.position.set(0,0.72,0.22);mintTop.rotation.x=-0.3;avatar.add(mintTop);

const strawTop1=createFruitDecor('strawberry');strawTop1.position.set(-0.18,0.72,0.18);strawTop1.rotation.z=0.4;avatar.add(strawTop1);
const strawTop2=createFruitDecor('strawberry');strawTop2.position.set(0.18,0.72,0.18);strawTop2.rotation.z=-0.4;avatar.add(strawTop2);

for(let i=0;i<4;i++){
const blue=createFruitDecor('blueberry');
const a=(i/4)*Math.PI*2+0.4;
blue.position.set(Math.cos(a)*0.25,0.72,Math.sin(a)*0.25);
avatar.add(blue);
}

faceGroup=new THREE.Group();
faceGroup.position.set(0,0.38,0.4);

eyeL=createEye();eyeL.position.set(-0.1,0.06,0);faceGroup.add(eyeL);
eyeR=createEye();eyeR.position.set(0.1,0.06,0);faceGroup.add(eyeR);

const browMat=new THREE.MeshStandardMaterial({color:0x5a3a2a,roughness:0.5});
browL=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.011,0.007),browMat);
browL.position.set(-0.1,0.14,0.025);browL.rotation.z=0.12;faceGroup.add(browL);
browR=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.011,0.007),browMat);
browR.position.set(0.1,0.14,0.025);browR.rotation.z=-0.12;faceGroup.add(browR);

const blushMat=new THREE.MeshBasicMaterial({color:0xff8888,transparent:true,opacity:0.35});
cheekL=new THREE.Mesh(new THREE.CircleGeometry(0.028,16),blushMat);
cheekL.position.set(-0.16,-0.01,0.025);faceGroup.add(cheekL);
cheekR=new THREE.Mesh(new THREE.CircleGeometry(0.028,16),blushMat);
cheekR.position.set(0.16,-0.01,0.025);faceGroup.add(cheekR);

const nose=new THREE.Mesh(new THREE.SphereGeometry(0.012,12,12),new THREE.MeshPhysicalMaterial({color:0xffb0c0,roughness:0.3,clearcoat:0.3}));
nose.position.set(0,-0.008,0.04);nose.scale.set(1,0.8,0.7);faceGroup.add(nose);

mouthObj=new THREE.Mesh(new THREE.SphereGeometry(0.028,20,10,0,Math.PI*2,0,Math.PI/2),new THREE.MeshPhysicalMaterial({color:0xe74c3c,roughness:0.2,clearcoat:0.6}));
mouthObj.rotation.x=Math.PI;mouthObj.position.set(0,-0.06,0.01);faceGroup.add(mouthObj);

avatar.add(faceGroup);

const armGeo=new THREE.CapsuleGeometry(0.025,0.16,8,12);
armL=new THREE.Mesh(armGeo,matSkin);armL.position.set(-0.45,0.35,0.05);armL.rotation.z=0.5;armL.name='armL';avatar.add(armL);
armR=new THREE.Mesh(armGeo,matSkin);armR.position.set(0.45,0.35,0.05);armR.rotation.z=-0.5;armR.name='armR';avatar.add(armR);

avatar.position.set(0,-0.3,0);
scene.add(avatar);

function createEye(){
const g=new THREE.Group();
const white=new THREE.Mesh(new THREE.SphereGeometry(0.042,24,24),new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:0.03,clearcoat:1.0,clearcoatRoughness:0.02}));
white.scale.set(1,1.2,0.6);g.add(white);
const iris=new THREE.Mesh(new THREE.CircleGeometry(0.026,24),new THREE.MeshPhysicalMaterial({color:0x6b4423,roughness:0.08,clearcoat:0.8,emissive:0x3a2211,emissiveIntensity:0.1}));
iris.position.z=0.03;g.add(iris);
const pup=new THREE.Mesh(new THREE.CircleGeometry(0.013,24),new THREE.MeshBasicMaterial({color:0x050505}));
pup.position.z=0.033;g.add(pup);
const s1=new THREE.Mesh(new THREE.CircleGeometry(0.006,12),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.95}));
s1.position.set(-0.007,0.008,0.036);g.add(s1);
const s2=new THREE.Mesh(new THREE.CircleGeometry(0.003,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.8}));
s2.position.set(0.004,-0.003,0.036);g.add(s2);
return g;
}

function blinkAnim(){
if(!eyeL||!eyeR)return;
let f=0;
const a=()=>{f++;let s=f<=3?1-f/3:f<=5?0.05:f<=8?(f-5)/3*0.95+0.05:1;
eyeL.scale.y=Math.max(0.05,s);eyeR.scale.y=Math.max(0.05,s);
if(f<8)requestAnimationFrame(a);};
a();
}

function speak(txt){
if(!voiceOn){showBubble(txt);return}
if(!S){showBubble(txt);return}
S.cancel();
const u=new SpeechSynthesisUtterance(txt);
u.lang='es-ES';u.rate=0.9;u.pitch=1.05;
const vs=S.getVoices();
const v=vs.find(x=>x.lang.startsWith('es'));
if(v)u.voice=v;
u.onstart=()=>{isTalking=true;showBubble(txt)};
u.onend=()=>{isTalking=false;hideBubble()};
S.speak(u);
}

function showBubble(t){document.getElementById('bubbleText').textContent=t;document.getElementById('bubble').classList.add('show')}
function hideBubble(){document.getElementById('bubble').classList.remove('show')}

document.getElementById('voiceBtn').onclick=function(){
voiceOn=!voiceOn;this.className=voiceOn?'btn on':'btn';
this.textContent=voiceOn?'Voz On':'Voz Off';
if(!voiceOn){S&&S.cancel();isTalking=false;hideBubble()}
};
document.getElementById('camBtn').onclick=function(){cinematicCam=!cinematicCam};
document.getElementById('greetBtn').onclick=function(){
speak('Bienvenidos a Chef Byte! Cada postre es una obra de arte cientifica.');
const aR=avatar.getObjectByName('armR');
if(aR){const orig=aR.rotation.z;let f=0;
const w=()=>{f++;aR.rotation.z=-0.5-Math.sin(f*0.3)*0.6;if(f<25)requestAnimationFrame(w);else aR.rotation.z=orig;};w();}
};

setTimeout(()=>{speak('Hola! Soy Chef Byte. Bienvenidos a la ciencia de los postres!')},1500);

window.addEventListener('mousemove',e=>{
mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;
eyeTarget.x=mouse.x*0.012;eyeTarget.y=mouse.y*0.01;
});

let bodySwayPhase=0,bodySwayAngle=0,bodySwayVel=0;
let lastFrameTime=performance.now();
function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),0.05);
const t=clock.getElapsedTime();

frameTimes.push(performance.now()-lastFrameTime);
lastFrameTime=performance.now();
if(frameTimes.length>60)frameTimes.shift();
if(frameTimes.length>0){
const avg=frameTimes.reduce((a,b)=>a+b)/frameTimes.length;
document.getElementById('fps').textContent=Math.round(1000/avg)+' FPS';
}

breathPhase+=dt*2.0;blinkTimer+=dt;
swayPhase+=dt*0.8;
bodySwayPhase+=dt*0.6;
if(blinkTimer>nextBlink){blinkTimer=0;nextBlink=1.5+Math.random()*3;blinkAnim();}

const targetSwayAngle=Math.sin(bodySwayPhase)*0.025;
bodySwayVel+=(targetSwayAngle-bodySwayAngle)*0.03;
bodySwayVel*=0.92;
bodySwayAngle+=bodySwayVel;

if(avatar){
const bob=Math.sin(breathPhase)*0.006;
const sway=Math.sin(swayPhase)*0.003;
avatar.position.y=-0.3+bob;
avatar.rotation.z=sway+bodySwayAngle;
avatar.rotation.x=Math.sin(breathPhase*0.5)*0.002;
}

if(isTalking){
mouthPhase+=dt*18;
if(mouthObj){
const openAmt=0.35+Math.abs(Math.sin(mouthPhase))*0.75;
const wideAmt=1+Math.sin(mouthPhase*1.5)*0.15;
mouthObj.scale.set(wideAmt,openAmt,1);
mouthObj.position.y=-0.06-Math.sin(mouthPhase*0.9)*0.003;
}
smileAmount+=(0.3-smileAmount)*0.1;
if(browL){
browL.rotation.z=0.12+Math.sin(t*4)*0.05;
browR.rotation.z=-0.12-Math.sin(t*4)*0.05;
browL.position.y=0.14+Math.sin(t*3)*0.003;
browR.position.y=0.14+Math.sin(t*3+0.5)*0.003;
}
if(cheekL){cheekL.material.opacity=0.35+Math.sin(t*5)*0.12;cheekR.material.opacity=0.35+Math.sin(t*5+0.3)*0.12;}
}else{
smileAmount+=(0.12-smileAmount)*0.06;
if(mouthObj){
mouthObj.scale.set(1+smileAmount*0.18,0.55+Math.sin(t*0.5)*0.05,1);
mouthObj.position.y=-0.06;
}
if(browL){
browL.rotation.z+=(0.12-browL.rotation.z)*0.06;
browR.rotation.z+=(-0.12-browR.rotation.z)*0.06;
browL.position.y+=(0.14-browL.position.y)*0.06;
browR.position.y+=(0.14-browR.position.y)*0.06;
}
if(cheekL){cheekL.material.opacity+=(0.35-cheekL.material.opacity)*0.06;cheekR.material.opacity+=(0.35-cheekR.material.opacity)*0.06;}
}

eyeCurrent.x+=(eyeTarget.x-eyeCurrent.x)*0.1;
eyeCurrent.y+=(eyeTarget.y-eyeCurrent.y)*0.1;
[eyeL,eyeR].forEach(eye=>{
if(eye&&eye.children[1]){
eye.children[1].position.x=eyeCurrent.x;
eye.children[1].position.y=eyeCurrent.y*0.8;
eye.children[2].position.x=eyeCurrent.x;
eye.children[2].position.y=eyeCurrent.y*0.8;
}
});

cherryAngle+=(bodySwayAngle*2+Math.sin(t*2.5)*0.004-cherryAngle*0.15);
cherryVel+=(-cherryAngle*0.2-cherryVel*0.12);cherryAngle+=cherryVel*dt*2;
if(cherryStem){cherryStem.rotation.z=0.2+cherryAngle;cherryStem.rotation.x=Math.sin(t*2)*0.06;}
if(cherryLeaf){cherryLeaf.rotation.z=-0.5+Math.sin(t*2.5)*0.12+bodySwayAngle*3;cherryLeaf.rotation.x=Math.sin(t*1.8)*0.08;}
if(cherryObj){
cherryObj.position.y=0.78+Math.sin(t*2)*0.005;
cherryObj.rotation.x=Math.sin(t*1.5)*0.03;
cherryObj.rotation.z=cherryAngle*0.8+Math.cos(t*1.8)*0.02;
cherryObj.position.x=cherryAngle*0.15;
}
if(cherryGlow){
cherryGlow.position.y=cherryObj.position.y;
cherryGlow.position.x=cherryObj.position.x;
cherryGlow.scale.setScalar(1+Math.sin(t*4)*0.1);
cherryGlow.material.opacity=0.08+Math.sin(t*4)*0.05;
}

const fL=avatar.getObjectByName('fruitL');
const fR=avatar.getObjectByName('fruitR');
if(fL){fL.rotation.z=0.3+Math.sin(t*1.2)*0.08;fL.rotation.x=-0.2+Math.sin(t*0.9)*0.05;}
if(fR){fR.rotation.z=-0.3+Math.sin(t*1.2+1)*0.08;fR.rotation.x=-0.2+Math.sin(t*0.9+1)*0.05;}

if(isTalking){
if(armL)armL.rotation.z=0.5+Math.sin(t*2.5)*0.15+Math.sin(t*4)*0.05;
if(armR)armR.rotation.z=-0.5+Math.sin(t*2.5+1)*0.15+Math.sin(t*4+1)*0.05;
if(armL)armL.rotation.x=Math.sin(t*2)*0.08;
if(armR)armR.rotation.x=Math.sin(t*2+0.5)*0.08;
}else{
if(armL){armL.rotation.z=0.5+Math.sin(t*0.7)*0.03;armL.rotation.x=Math.sin(t*0.5)*0.02;}
if(armR){armR.rotation.z=-0.5+Math.sin(t*0.7+1)*0.03;armR.rotation.x=Math.sin(t*0.5+0.7)*0.02;}
}

ring1.rotation.z=t*0.15;ring2.rotation.z=-t*0.1;
ring1.material.emissiveIntensity=0.3+Math.sin(t*3)*0.1;
ring2.material.emissiveIntensity=0.2+Math.sin(t*3+1)*0.1;

accentLight.intensity=0.5+Math.sin(t*2)*0.2;

const sp=sparkles.geometry.attributes.position.array;
for(let i=0;i<sparkleCount;i++){
sp[i*3]+=sparkleVel[i].x+Math.sin(t*2+sparkleVel[i].phase)*0.001;
sp[i*3+1]+=sparkleVel[i].y;
sp[i*3+2]+=sparkleVel[i].z+Math.cos(t*2+sparkleVel[i].phase)*0.001;
if(sp[i*3+1]>1.8){sp[i*3]=(Math.random()-0.5)*2;sp[i*3+1]=-0.1;sp[i*3+2]=(Math.random()-0.5)*2;}
}
sparkles.geometry.attributes.position.needsUpdate=true;
sparkleMat.opacity=0.4+Math.sin(t*3)*0.15;

const gp=godRays.geometry.attributes.position.array;
for(let i=0;i<godRayCount;i++){
gp[i*3]+=godRayVel[i].x+Math.sin(t+godRayVel[i].phase)*0.0005;
gp[i*3+1]+=godRayVel[i].y;
gp[i*3+2]+=godRayVel[i].z+Math.cos(t+godRayVel[i].phase)*0.0005;
if(gp[i*3+1]<-0.5){gp[i*3]=(Math.random()-0.5)*4;gp[i*3+1]=3.5;gp[i*3+2]=(Math.random()-0.5)*4;}
}
godRays.geometry.attributes.position.needsUpdate=true;
godRayMat.opacity=0.2+Math.sin(t*2)*0.08;

if(cinematicCam){
camPhase+=dt*0.12;
camera.position.x=Math.sin(camPhase)*0.9;
camera.position.y=0.35+Math.sin(camPhase*0.7)*0.15;
camera.position.z=2.3+Math.cos(camPhase*0.5)*0.5;
camera.lookAt(0,0.35,0);
}

filmPass.uniforms.time.value=t*80;
controls.update();
composer.render();
}
animate();

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
